# Cotironda — solo configuración local y por función.
# El deploy en cotironda-dev debe elegir explícitamente el project ref.
project_id = "cotironda"

[functions.cotironda-ia-dev]
# La función es exclusiva para backend con apikey sb_secret_*;
# estas keys no son JWT. withSupabase auth:'secret' verifica el caller.
verify_jwt = false

[functions.cotironda-piloto-finalistas]
# Internal scheduler only, authenticated by 48+ byte shared secret in the
# Edge handler. JWT is deliberately disabled because the worker is invoked
# by scheduled GitHub Actions, not a Supabase user session.
verify_jwt = false

[functions.cotironda-piloto-document-recovery]
# Service-to-service only: withSupabase auth secret; never publish this API key.
verify_jwt = false

[functions.cotironda-piloto-v2-shadow]
# PRIVATE, manual tick only. Supabase modern sb_secret_ is NOT a JWT.
# Authorization is checked independently in handler.ts with TWO factors:
# project service key and existing recovery secret. SQL flag defaults OFF.
# This entry DOES NOT deploy or enable the Edge function.
verify_jwt = false

[functions.cotironda-piloto-v2-pdf-reader]
# Isolated PDF text extraction. Only the V2 buyer Auth SERVER can call.
# Verify long COTIRONDA_PILOT_V2_PDF_SHARED_SECRET inside the handler;
# modern sb_secret_ and the opaque shared secret are NOT a JWT.
# Feature flags remain OFF; this stanza alone does NOT deploy the function.
verify_jwt = false

[functions.cotironda-piloto-v2-text-reader]
# Exclusivamente JWT REAL del comprador emitido por Auth Supabase.
# Además exige secreto interno segregado y verifica sesión/consentimiento
# actual en SQL. No usar service_role como bearer para este endpoint.
# Esta definición NO despliega ni activa la función.
verify_jwt = true

[functions.cotironda-piloto-v2-text-reader-d016]
# Exclusivamente servidor Next del PILOTO con apikey sb_secret_ y un segundo
# secreto interno independiente: D016 sessionHmac + dos RPC revalidan el
# comprador/ronda/consentimiento. Nunca acceso directo del navegador.
# Nuevos flags OFF, sin despliegue sin «Publicalo».
# sb_secret_* NO es JWT, por eso el gateway no hace verificación GoTrue.
verify_jwt = false

[functions.cotironda-piloto-v2-worker-d016]
# Cron -> Supabase Edge (no navegador). Dos secretos independientes
# y RPC exclusivas de service_role; flags OFF hasta Publicalo PILOTO.
verify_jwt = false

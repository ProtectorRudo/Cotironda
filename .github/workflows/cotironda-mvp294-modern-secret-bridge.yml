name: Cotironda MVP294 - new Supabase secret keys private worker
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/functions/cotironda-piloto-auto-recovery/index.ts'
      - 'supabase/functions/cotironda-piloto-auto-recovery/internal-auth-mvp294.ts'
      - 'supabase/functions/cotironda-piloto-document-recovery/auto-recovery-tick-mvp293.ts'
      - 'tests/unit/mvp293-scheduled-recovery-bridge.test.mjs'
      - 'tests/unit/mvp294-internal-auth.test.mjs'
      - '.github/workflows/cotironda-mvp294-modern-secret-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-key-private-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Node 22 - exact two factors, no secret exposure
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp293-scheduled-recovery-bridge.test.mjs \
            tests/unit/mvp294-internal-auth.test.mjs
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Deno - worker + scheduled Edge backward compatibility
        run: |
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-auto-recovery/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-document-recovery/index.ts
# No real user data, secrets, Whapi or deployed scheduled job.

name: Cotironda V2 D016 - aviso y evidencia proveedor P0
on:
  pull_request:
    paths:
      - 'src/server/v2-d016-aviso-original-proveedor.ts'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-dispatch-d016.ts'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-dispatch-mvp223.ts'
      - 'supabase/functions/cotironda-piloto-whapi/original-notice-dispatch-d016.ts'
      - 'scripts/piloto/v2-d016-original-notice-overlay.mjs'
      - 'scripts/piloto/v2-d016-original-inbox-overlay.mjs'
      - 'supabase/functions/cotironda-piloto-whapi/original-reply-intake-d016.ts'
      - 'supabase/piloto/v2_d016_original_whapi_inbox_CANDIDATE.sql'
      - 'supabase/piloto/v2_d016_global_original_optout_CANDIDATE.sql'
      - 'supabase/tests/ci/v2-d016-global-original-optout-pg17.sql'
      - 'supabase/piloto/v2_d016_original_semantic_mvp291_proof_CANDIDATE.sql'
      - 'supabase/tests/ci/v2-d016-original-semantic-mvp291-pg17.sql'
      - 'supabase/tests/ci/v2-d016-original-inbox-pg17.sql'
      - 'tests/unit/v2-d016-original-inbox.test.mjs'
      - 'tests/unit/v2-d016-original-whapi-adapter.test.mjs'
      - 'supabase/piloto/v2_d016_original_reply_proof_CANDIDATE.sql'
      - 'supabase/piloto/v2_d016_portal_original_evidence_gate_CANDIDATE.sql'
      - 'supabase/tests/ci/v2-d016-original-evidence-download-pg17.sql'
      - 'supabase/tests/fixtures/v2-d016-original-evidence-download-checks.sql'
      - 'supabase/piloto/v2_d016_original_notice_lease_guard_CANDIDATE.sql'
      - 'supabase/tests/ci/v2-d016-original-lease-guard-pg17.sql'
      - 'supabase/tests/ci/v2-d016-original-proof-pg17.sql'
      - 'tests/unit/v2-d016-aviso-original-proveedor.test.mjs'
      - 'docs/V2-D016-EVIDENCIA-RESPUESTA-ORIGINALES-20261113.md'
      - '.github/workflows/cotironda-d016-evidencia-proveedor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22.16 exacto
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verificar aviso en un solo mensaje y respuestas de proveedor
        run: node --experimental-strip-types --test tests/unit/v2-d016-aviso-original-proveedor.test.mjs
      - name: Contrato D016 de despacho único, ID Whapi y flags OFF
        run: node --experimental-strip-types --test tests/unit/v2-d016-original-whapi-adapter.test.mjs
      - name: Entrada D016 original y revocación, sin enviar mensajes
        run: node --experimental-strip-types --test tests/unit/v2-d016-original-inbox.test.mjs
      - name: Deno 2 para tipado de candidato generado, sin desplegar webhook
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Construir candidato D016 desde webhook v76 verificado (sin despliegue)
        run: node scripts/piloto/v2-d016-original-notice-overlay.mjs --write-candidate
      - name: Typecheck Deno del webhook Whapi V2 + evidencia
        run: deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.v2-d016-original-candidate.ts
      - name: Generar candidato con recepción D016, sin desplegar
        run: node scripts/piloto/v2-d016-original-inbox-overlay.mjs --write-candidate
      - name: Deno typecheck de salida + recepción Whapi
        run: deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.v2-d016-inbox-candidate.ts
      - name: Eliminar candidato generado sin tocar index.ts
        if: always()
        run: |
          rm -f supabase/functions/cotironda-piloto-whapi/index.v2-d016-original-candidate.ts
          rm -f supabase/functions/cotironda-piloto-whapi/index.v2-d016-inbox-candidate.ts
  evidence-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout sin secrets ni tokens persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: SQL de pruebas PostgreSQL 17 con ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-original-proof-pg17.sql
      - name: Lease correcto, grants y rollback PostgreSQL17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-original-lease-guard-pg17.sql
      - name: Recepción real simulada, PDF y NO COMPARTIR con PG17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-original-inbox-pg17.sql
      - name: Decisión IA doble corroborada, hash y baja de originales PG17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-original-semantic-mvp291-pg17.sql
      - name: Portal D016: originales solo con aviso y respuesta, baja bloquea PDF y texto
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-original-evidence-download-pg17.sql
      - name: BAJA global NO COMPARTIR con y sin rondas, futuras invitaciones y RLS PG17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d016-global-original-optout-pg17.sql
      - name: Confirmar rollback completo y ausencia de datos
        run: |
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL")" = t
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_v2_d016_observe_original_reply_private(uuid,text,text,text,boolean,boolean)') IS NULL")" = t

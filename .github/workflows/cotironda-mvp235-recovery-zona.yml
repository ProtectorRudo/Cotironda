name: Cotironda IA Central — recuperación compatible con localidad MVP235
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp235_recovery_compatibilidad_zona.sql'
      - 'supabase/tests/ci/mvp235_recovery_zona_pg17.sql'
      - '.github/workflows/cotironda-mvp235-recovery-zona.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'MVP235: frescura de reanudaciones, errores, permisos y no duplicados'
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp235_recovery_zona_pg17.sql

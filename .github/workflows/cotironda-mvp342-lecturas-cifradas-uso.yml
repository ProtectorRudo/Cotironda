name: Cotironda MVP342 - evidencia cifrada y tokens observados
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/cifrado-lectura-lotes-mvp342.ts'
      - 'src/domain/ia-central/worker-lecturas-medidas-mvp342.ts'
      - 'supabase/functions/cotironda-piloto-whapi/lector-uso-lotes-mvp342.ts'
      - 'supabase/functions/cotironda-piloto-whapi/worker-originales-medidos-mvp342.ts'
      - 'supabase/piloto/mvp342_*'
      - 'supabase/tests/ci/mvp342-*'
      - 'scripts/piloto/mvp342-*'
      - 'tests/unit/mvp342-*'
      - 'docs/477-*'
      - '.github/workflows/cotironda-mvp342-lecturas-cifradas-uso.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-usage-private:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: AES-GCM AAD, cuota, dos lecturas cifradas y Responses mock
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp342-cifrado-y-metering-privado.test.mjs \
            tests/unit/mvp342-responses-usage-real-mock.test.mjs \
            tests/unit/mvp341-worker-original-privado.test.mjs \
            tests/unit/mvp340-reserva-sql-adapter.test.mjs
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Typecheck worker core and Edge import separation
        run: |
          deno check --node-modules-dir=auto src/domain/ia-central/cifrado-lectura-lotes-mvp342.ts
          deno check --node-modules-dir=auto src/domain/ia-central/worker-lecturas-medidas-mvp342.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/lector-uso-lotes-mvp342.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/worker-originales-medidos-mvp342.ts
  durable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: PG17 leases + encrypted usage + RLS + full rollback
        run: |
          set -euo pipefail
          node scripts/piloto/mvp342-private-usage-builder.mjs --assert-local
          node scripts/piloto/mvp342-private-usage-builder.mjs --sql > supabase/tests/ci/.mvp342.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp342.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp342.sql
# ZERO external OpenAI calls; all source data and API responses are synthetic.

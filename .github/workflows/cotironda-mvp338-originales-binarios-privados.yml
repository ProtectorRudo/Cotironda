name: Cotironda MVP338 - bytes reales y evidencia privada
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/fuente-binaria-privada-mvp338.ts'
      - 'supabase/functions/cotironda-piloto-whapi/lector-evidencia-binaria-mvp338.ts'
      - 'tests/unit/mvp338-*'
      - 'docs/473-*'
      - '.github/workflows/cotironda-mvp338-originales-binarios-privados.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-binary-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Actual DOCX XLSX bytes, CSV TXT, adversarial formats - Node
        run: node --experimental-strip-types --test tests/unit/mvp338-binary-evidence-private.test.mjs
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Typecheck private bridge with pinned source readers
        run: |
          deno check --node-modules-dir=auto src/domain/ia-central/fuente-binaria-privada-mvp338.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/lector-evidencia-binaria-mvp338.ts
      - name: Actual two-page PDF parsed by unpdf@2.1.0 (synthetic original)
        run: deno run --node-modules-dir=auto tests/unit/mvp338-real-pdf-deno.smoke.ts
      - name: Baseline flexible evidence corpus - no model inference
        run: |
          node --experimental-strip-types --test tests/unit/mvp337-ingesta-universal-proveedores.test.mjs
          node --experimental-strip-types scripts/eval/mvp337-corpus-offline.mjs
# No production/pilot writes. No OpenAI, Whapi or personal documents.

name: Cotironda - Generar nombre migracion CLI (TEMPORAL)
on:
  pull_request:
    paths:
      - '.github/workflows/ci-generate-migration-name.yml'
permissions:
  contents: read
jobs:
  name-from-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout solo lectura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node version fijada
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Generar nombre oficial de migracion (no toca Supabase remoto)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.122.0 --version
          npx --yes supabase@2.122.0 migration new commercial_session_guard
          matches=(supabase/migrations/*_commercial_session_guard.sql)
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo 'ERROR: Supabase CLI no produjo exactamente un archivo' >&2
            exit 1
          fi
          echo "CLI_GENERATED_MIGRATION=${matches[0]}"
          echo 'No se aplica, conecta ni despliega ninguna base remota.'

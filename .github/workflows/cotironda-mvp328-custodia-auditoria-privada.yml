name: MVP328 - custodia cifrada y auditoria interna sin publicar
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp328_lectura_cifrada_y_auditoria_interna.sql'
      - 'supabase/tests/ci/mvp328-private-custody-pg17.sql'
      - 'src/domain/ia-central/custodia-conciliacion-interna-mvp328.ts'
      - 'src/domain/ia-central/conciliacion-original-textual-mvp327.ts'
      - 'tests/unit/mvp328-internal-custody-audit.test.mjs'
      - '.github/workflows/cotironda-mvp328-custodia-auditoria-privada.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custodia-y-auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: AES-GCM, fuente exacta, suplantacion y reintentos inexistentes
        run: |
          node --experimental-strip-types --test tests/unit/mvp328-internal-custody-audit.test.mjs
          node --experimental-strip-types --test tests/unit/mvp327-conciliacion-original-sin-ia.test.mjs
      - name: PostgreSQL17 real — envelope service_role y registro inmutable
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp328-private-custody-pg17.sql > /dev/null
      - name: Sintaxis y no publicacion
        run: |
          node --check tests/unit/mvp328-internal-custody-audit.test.mjs
          node --check tests/unit/mvp327-conciliacion-original-sin-ia.test.mjs
# Fixtures only; no real Supabase, OpenAI, Whapi, cron or Vercel traffic.

name: Cotironda MVP346 - candidato economico privado PDF
on:
  pull_request:
    branches:
      - fix/mvp345-replay-estado-comercial-honesto
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/supplier-economic-revision-mvp346.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-archive-replay-mvp292.ts'
      - 'supabase/piloto/mvp346*'
      - 'supabase/tests/ci/mvp346*'
      - 'tests/unit/mvp346*'
      - '.github/workflows/cotironda-mvp346-revision-privada.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: |
          node --experimental-strip-types --test \
            tests/unit/mvp346-revision-economica-privada.test.mjs \
            tests/unit/mvp345-worker-publication-status.test.mjs \
            tests/unit/mvp344-diagnostico-precios-original-pdf.test.mjs \
            tests/unit/mvp343-flujo-documento-recuperado.test.mjs \
            tests/unit/mvp292-archive-auto-recovery.test.mjs
  candidate-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Una sola candidata privada y rollback PG17
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -tA \
            -f supabase/tests/ci/mvp346-economic-revision-rollback.sql \
            | grep -Fx 't'
          psql -X -tA -c "select to_regnamespace('cotironda_piloto_privado') is null" | grep -Fx 't'
  candidate-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cotironda-piloto-whapi/supplier-economic-revision-mvp346.ts \
            supabase/functions/cotironda-piloto-whapi/supplier-archive-replay-mvp292.ts \
            supabase/functions/cotironda-piloto-auto-recovery/index.ts
# No service secrets, live writes, OpenAI calls, WhatsApp sends or deployments.

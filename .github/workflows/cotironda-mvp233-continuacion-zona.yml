name: Cotironda IA Central — continuidad de zona MVP233
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp233_localidad_central_continuacion.sql'
      - 'supabase/tests/ci/mvp233-continuacion-zona-pg17.sql'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-zone-mvp233.ts'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'tests/unit/mvp233-continuacion-localidad.test.mjs'
      - '.github/workflows/cotironda-mvp233-continuacion-zona.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Continuación IA: fuente original, localidad y controles
        run: node --experimental-strip-types --test tests/unit/mvp233-continuacion-localidad.test.mjs
      - name: PostgreSQL 17: transición atómica, roles, gates y reintentos
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp233-continuacion-zona-pg17.sql

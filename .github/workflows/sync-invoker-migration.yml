name: Versionar migracion invoker de desarrollo
on:
  push:
    branches: [fix/01-invoker-rpc-verified-email]
permissions:
  contents: write
jobs:
  migration:
    if: github.repository == 'ProtectorRudo/Cotironda'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Generar archivo con Supabase CLI
        id: generate
        run: |
          set -euo pipefail
          target="supabase/migrations/20261029122708_invoker_verified_email_hook.sql"
          if [ -f "$target" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new invoker_verified_email_hook
          gen="$(find supabase/migrations -maxdepth 1 -name '*_invoker_verified_email_hook.sql' ! -name '20261029122708_invoker_verified_email_hook.sql' | sort | tail -n1)"
          test -n "$gen"
          mv "$gen" "$target"
          cp supabase/changes/05_invoker_email_hook.sql "$target"
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Guardar migracion en rama autorizada
        if: steps.generate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/invoker-version.json',JSON.stringify({message:'docs(db): versionar migracion invoker correo verificado',content:fs.readFileSync('supabase/migrations/20261029122708_invoker_verified_email_hook.sql').toString('base64'),branch:process.env.BRANCH}))"
          gh api --method PUT "repos/$REPO/contents/supabase/migrations/20261029122708_invoker_verified_email_hook.sql" --input /tmp/invoker-version.json > /dev/null
          rm -f /tmp/invoker-version.json

name: Web publica Cotironda - fidelidad y simulacion
on:
  pull_request:
    branches: [main, 'feat/mvp-084-web-publica-actualizada']
    paths:
      - 'site/**'
      - 'scripts/test-public-demo.mjs'
      - '.github/workflows/site-public-check.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/test-public-demo.mjs'
      - '.github/workflows/site-public-check.yml'
permissions:
  contents: read
jobs:
  web-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validar JS de la demo
        run: node --check site/app.js
      - name: Probar texto, privacidad y calculos ficticios
        run: node --test scripts/test-public-demo.mjs

name: Cotironda MVP349 - orden unico de lecturas sin inferir material
on:
  pull_request:
    branches:
      - fix/v2-b7-unmapped-rows-risk-first-20261111
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/supplier-material-fidelity-mvp348.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-auto-recovery-worker-mvp292.ts'
      - 'tests/unit/mvp348-fidelidad-y-operacion-cron.test.mjs'
      - 'docs/484*'
      - 'docs/485*'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - '.github/workflows/cotironda-mvp349-reorden-unico.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity-node:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Economic and source safety regression (synthetic only)
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp348-fidelidad-y-operacion-cron.test.mjs \
            tests/unit/mvp292-archive-auto-recovery.test.mjs \
            tests/unit/mvp293-scheduled-recovery-bridge.test.mjs \
            tests/unit/mvp346-revision-economica-privada.test.mjs \
            tests/unit/mvp347-revision-pdf-publicacion.test.mjs
  sql-retry-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: PostgreSQL 17 — conservar bloqueo de reintento conflictivo, ROLLBACK
        run: |
          set -euo pipefail
          node scripts/piloto/mvp336-retry-source-builder.mjs --sql > supabase/tests/ci/.mvp349.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp349.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp349.sql
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Suite completa de dominio (sin red)
        run: node --experimental-strip-types --test tests/unit/*.test.mjs
  edge-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Typecheck internal recovery and revised material validator
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cotironda-piloto-whapi/supplier-material-fidelity-mvp348.ts \
            supabase/functions/cotironda-piloto-whapi/supplier-auto-recovery-worker-mvp292.ts \
            supabase/functions/cotironda-piloto-auto-recovery/index.ts
# No live database, OpenAI, WhatsApp, cron, secrets, or Supabase deployment.

name: Cotironda PILOTO - archivo ZIP cifrado móvil MVP269
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'scripts/ops/package-pilot-mobile-mvp269.mjs'
      - 'tests/unit/mvp269-mobile-backup-zip.test.mjs'
      - '.github/workflows/cotironda-mvp269-mobile-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-archive-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify archive utilities
        run: |
          command -v zip
          command -v unzip
      - name: Test isolated synthetic encrypted package only
        run: node --test tests/unit/mvp269-mobile-backup-zip.test.mjs
# This workflow never connects to Supabase, exports real data or uploads artifacts.

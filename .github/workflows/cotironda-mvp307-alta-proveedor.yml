name: MVP307 - alta contacto en un mensaje y ruteo solo proveedores autorizados
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp307_alta_proveedor_contacto_y_ruteo.sql'
      - 'supabase/piloto/mvp073_onboarding_codes_operator.sql'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'scripts/piloto/mvp307-generar-fixture-pg17.mjs'
      - 'tests/unit/mvp307-*'
      - '.github/workflows/cotironda-mvp307-alta-proveedor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consentimiento-y-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contratos, privacy, sintaxis y consentimiento sin fricción
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp307-enrollment-consent-and-preroute.test.mjs \
            tests/unit/mvp306-auto-release-and-supplier-contacts.test.mjs \
            tests/unit/mvp304-contactos-consentidos-cierre.test.mjs
      - name: PostgreSQL 17 - alta, consentimientos, revocación y ruteo pre IA
        run: |
          set -euo pipefail
          node scripts/piloto/mvp307-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp307-generated-pg17.sql >/dev/null
# 100 % sintético. No accede al Supabase piloto, Whapi, Vercel ni OpenAI.

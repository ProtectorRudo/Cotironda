name: Cotironda MVP282 - 21 migraciones cubiertas en PG17 sintetico
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'scripts/piloto/mvp282-*'
      - 'tests/unit/mvp282-*'
      - '.github/workflows/cotironda-mvp282-21-sql-isolated-pg17.yml'
      - 'supabase/piloto/mvp2*.sql'
      - 'supabase/tests/ci/mvp2*.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-modular-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contratos 21 SQL / 11 fixtures / no conexion piloto
        run: |
          node --test tests/unit/mvp282-integrated-fixture-coverage.test.mjs
          node scripts/piloto/mvp282-pg17-modular-rehearsal.mjs --check
      - name: PG17 transaccional sintético - 11 fixtures rollback
        run: |
          set -euo pipefail
          node scripts/piloto/mvp282-pg17-modular-rehearsal.mjs --run
# No Supabase/Whapi/OpenAI/Vercel; no 21 SQL coinstalados en un unico esquema.

name: Cotironda MVP341 - trabajador privado y originales SHA
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/worker-privado-lotes-mvp341.ts'
      - 'supabase/functions/cotironda-piloto-whapi/worker-originales-lotes-mvp341.ts'
      - 'supabase/piloto/mvp341_*'
      - 'supabase/tests/ci/mvp341-*'
      - 'scripts/piloto/mvp341-*'
      - 'tests/unit/mvp341-*'
      - 'docs/476-*'
      - '.github/workflows/cotironda-mvp341-worker-privado-lotes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-private-node:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Worker real ZIP y controles negativos, sin OpenAI
        run: |
          node --experimental-strip-types --test tests/unit/mvp341-worker-original-privado.test.mjs
          node --experimental-strip-types --test tests/unit/mvp340-reserva-sql-adapter.test.mjs
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Deno check worker core y adaptador Edge
        run: |
          deno check --node-modules-dir=auto src/domain/ia-central/worker-privado-lotes-mvp341.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/worker-originales-lotes-mvp341.ts
      - name: PDF de dos paginas por unpdf real, reserva y doble lectura mock
        run: deno run --node-modules-dir=auto tests/unit/mvp341-pdf-edge-worker-deno.smoke.ts
  source-preflight-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: PG17 candidato ligado, permiso service_role y ROLLBACK final
        run: |
          set -euo pipefail
          node scripts/piloto/mvp341-private-worker-builder.mjs --assert-local
          node scripts/piloto/mvp341-private-worker-builder.mjs --sql > supabase/tests/ci/.mvp341.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp341.sql > /dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp341.sql
# NO CREDENTIALS; not deployed; no SQL against real pilot; no IA charges.

name: Cotironda B5g - reauditoria historica sin IA ni sobrescritura
on:
  pull_request:
    branches:
      - feat/v2-b5f-cotejo-pdf-total-descuento-posicional-20261111
    paths:
      - 'src/domain/presupuestos-v2/**'
      - 'supabase/functions/cotironda-piloto-v2-shadow/**'
      - 'supabase/piloto/v2_b5g*'
      - 'supabase/tests/ci/v2-b5g*'
      - 'tests/unit/presupuestos-v2-b5g-*'
      - '.github/workflows/cotironda-v2-b5g-replay-historico-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Unit workers, archived SHA, B5f amounts and Edge auth
        run: |
          node --experimental-strip-types --test \
            tests/unit/presupuestos-v2-b5g-replay-private.test.mjs \
            tests/unit/presupuestos-v2-b5g-edge-private.test.mjs \
            tests/unit/presupuestos-v2-b5f-total-descuento-origen.test.mjs \
            tests/unit/presupuestos-v2-b5f-descuento-aritmetica-fuente.test.mjs \
            tests/unit/presupuestos-v2-b3-edge-handler.test.mjs
  deno-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cotironda-piloto-v2-shadow/index.ts
          deno test --allow-all --node-modules-dir=auto \
            tests/deno/b5f-geometria-pdf-real.test.ts
  postgres17-private:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -tA \
            -f supabase/tests/ci/v2-b5g-private-pdf-recheck-pg17-rollback.sql \
            | grep -Fx 't'
          psql -X -tA -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
# CI synthetic only: no production, Supabase migration, OpenAI or WhatsApp.

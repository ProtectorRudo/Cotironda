name: Cotironda PILOTO - preflight read-only y puertas MVP268
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp268_launch_readiness_readonly.sql'
      - 'supabase/tests/ci/mvp268-launch-readiness-pg17.sql'
      - 'tests/unit/mvp268-pilot-readiness-contract.test.mjs'
      - '.github/workflows/cotironda-mvp268-launch-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'PG17 reversible: preflight benigno y entorno inseguro'
        shell: bash
        run: |
          set -euo pipefail
          psql -X -At -v ON_ERROR_STOP=1 \
            -f supabase/tests/ci/mvp268-launch-readiness-pg17.sql \
            > /tmp/mvp268-readiness-ci-output
          mapfile -t reports < <(grep '^{' /tmp/mvp268-readiness-ci-output)
          test "${#reports[@]}" -eq 2
          printf '%s\n' "${reports[0]}" | jq -e '
            .state=="pilot_readiness_preflight_mvp268" and
            .audit_mode=="read_only" and
            .modules_checked==12 and .modules_installed==0 and
            (.modules_missing|length)==12 and
            .technical_flags_all_off==true and
            .whapi_api_accepted_not_delivered==1 and
            .whapi_outbound_uncertain==0 and
            .new_supervisor_cron_inactive==true and
            .pg_cron_available==false and
            .ready_for_controlled_schema_install==false and
            .ready_for_real_whatsapp_pilot==false and
            .release_authorized==false
          '
          printf '%s\n' "${reports[1]}" | jq -e '
            .technical_flags_all_off==false and
            .gates.dispatch_off==false and
            .whapi_outbound_uncertain==1 and
            .new_supervisor_cron_inactive==false and
            .ready_for_controlled_schema_install==false and
            .ready_for_real_whatsapp_pilot==false and
            .release_authorized==false
          '
  node-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Contrato: cero efectos secundarios y cero falsas certificaciones'
        run: >-
          node --test tests/unit/mvp268-pilot-readiness-contract.test.mjs
# No Supabase PILOT writes, Whapi sends, cron, Vercel deployments or real OpenAI.

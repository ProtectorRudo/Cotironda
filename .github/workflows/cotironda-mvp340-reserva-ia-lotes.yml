name: Cotironda MVP340 - Reserva durable IA lotes, PostgreSQL17
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp340_*'
      - 'supabase/tests/ci/mvp340-*'
      - 'src/domain/ia-central/puente-reserva-sql-mvp340.ts'
      - 'scripts/piloto/mvp340-*'
      - 'tests/unit/mvp340-*'
      - 'docs/475-*'
      - '.github/workflows/cotironda-mvp340-reserva-ia-lotes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-lease-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Contrato JS/TS: SHA del plan, scope y RPC sin precios publicados'
        run: |
          node --experimental-strip-types --test tests/unit/mvp340-reserva-sql-adapter.test.mjs
          node --experimental-strip-types --test tests/unit/mvp339-lotes-ia-privados.test.mjs
          node scripts/piloto/mvp340-ledger-builder.mjs --assert-local
      - name: PostgreSQL17 - migración y ACL, fuente legítima, lease único, ROLLBACK
        run: |
          set -euo pipefail
          node scripts/piloto/mvp340-ledger-builder.mjs --sql > supabase/tests/ci/.mvp340.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp340.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp340.sql
  typecheck-private:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Deno TypeScript contrato SQL + lotes
        run: |
          deno check src/domain/ia-central/puente-reserva-sql-mvp340.ts
          deno check src/domain/ia-central/procesador-ia-lotes-mvp339.ts
# No llamadas a Supabase real, ni OpenAI, Whapi, cron, deploy o producción.

name: MVP329 - operador MFA tickets y permiso por comprador
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp329_operador_conciliacion_tickets_scope.sql'
      - 'supabase/tests/ci/mvp329-scoped-operator-auth-pg17.sql'
      - 'src/domain/ia-central/operador-conciliacion-autorizado-mvp329.ts'
      - 'src/domain/ia-central/custodia-conciliacion-interna-mvp328.ts'
      - 'tests/unit/mvp329-operator-reconciliation-ticket.test.mjs'
      - '.github/workflows/cotironda-mvp329-operator-scope-tickets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfa-scope-one-use:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Pruebas de operador y custodia AES en entorno ficticio
        run: |
          node --experimental-strip-types --test tests/unit/mvp329-operator-reconciliation-ticket.test.mjs
          node --experimental-strip-types --test tests/unit/mvp328-internal-custody-audit.test.mjs
      - name: PostgreSQL 17 MFA AAL2, operador autenticado, empresa y un solo uso
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp329-scoped-operator-auth-pg17.sql > /dev/null
      - name: Sintaxis y no exposición de secretos en código cliente
        run: |
          node --check tests/unit/mvp329-operator-reconciliation-ticket.test.mjs
          node --check tests/unit/mvp328-internal-custody-audit.test.mjs
# No real users, no Supabase pilot writes, no Vercel build, no outbound.

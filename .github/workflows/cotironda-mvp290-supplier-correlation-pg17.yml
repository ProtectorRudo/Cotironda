name: Cotironda MVP290 - correlacion segura proveedor PG17
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-*mvp290.ts'
      - 'supabase/piloto/mvp290_*'
      - 'supabase/tests/ci/mvp290-*'
      - 'scripts/piloto/mvp290-*'
      - 'tests/unit/mvp290-*'
      - '.github/workflows/cotironda-mvp290-supplier-correlation-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supplier-round-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Node - proveedores, idempotencia, contratos heredados
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp290-supplier-correlation.test.mjs \
            tests/unit/mvp279-buyer-whatsapp-review.test.mjs \
            tests/unit/mvp289-buyer-tracking-confirmation.test.mjs
          node scripts/piloto/mvp290-supplier-correlation-builder.mjs --assert-local
      - name: PostgreSQL 17 - rondas superpuestas, RLS y rollback unico
        run: |
          set -euo pipefail
          node scripts/piloto/mvp290-supplier-correlation-builder.mjs --sql > supabase/tests/ci/.mvp290.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp290.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp290.sql
# No Whapi, no PDF reales, no Supabase remoto ni modificaciones de producción.

name: Cotironda MVP285 - 21 migraciones + E2E + operador SQL OFF
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp285_*'
      - 'supabase/tests/ci/mvp285-*'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'scripts/piloto/mvp285-operator-gate-builder.mjs'
      - 'tests/unit/mvp285-operator-review-gates.test.mjs'
      - '.github/workflows/cotironda-mvp285-pilot-operator-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-operator-gate-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Seguridad del operador, sin secretos
        run: |
          node --test tests/unit/mvp285-operator-review-gates.test.mjs
          node scripts/piloto/mvp285-operator-gate-builder.mjs --assert-local
          node scripts/piloto/mvp285-operator-gate-builder.mjs --sql > supabase/tests/ci/.mvp285-operator-gate.sql
      - name: PG17 - todos los contratos, cuatro puertas y rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp285-operator-gate.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp285-operator-gate.sql
# Solo PG17 sintético. No Whapi, no Supabase remoto, no pagos.

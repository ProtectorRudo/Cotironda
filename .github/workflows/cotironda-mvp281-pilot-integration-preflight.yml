name: Cotironda MVP281 - preflight integracion segura sin despliegues
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'scripts/piloto/mvp281-*'
      - 'tests/unit/mvp281-*'
      - '.github/workflows/cotironda-mvp281-pilot-integration-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verificar manifiesto sin conectar a Supabase ni Whapi
        run: |
          node --test tests/unit/mvp281-pilot-integration-manifest.test.mjs
          node scripts/piloto/mvp281-manifiesto-integracion.mjs --check

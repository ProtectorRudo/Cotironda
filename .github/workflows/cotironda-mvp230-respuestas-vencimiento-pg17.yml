name: Cotironda IA Central — presupuestos luego de ventana PG17
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp230_respuestas_proveedor_tras_vencimiento.sql'
      - 'supabase/tests/ci/mvp230_presupuestos_tras_ensayo_pg17.sql'
      - '.github/workflows/cotironda-mvp230-respuestas-vencimiento-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  late-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: "Probar recepción tardía, gate OFF, rechazo a proveedor sin PDF aceptado y ROLLBACK"
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp230_presupuestos_tras_ensayo_pg17.sql > /dev/null

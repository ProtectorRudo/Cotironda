name: Cotironda PILOTO Vault cron auth PostgreSQL17
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp132_recovery_secret_and_guard.sql'
      - 'supabase/tests/ci/mvp132-vault-cron-auth.sql'
      - '.github/workflows/cotironda-piloto-recovery-vault.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cotironda_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_recovery_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: cotironda_recovery_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Smoke Vault auth and role privileges, no plaintext output
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp132-vault-cron-auth.sql > /dev/null

name: Cotironda MVP301 - offline roundtrip and finalists proposal
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'src/domain/ia-central/planificador-finalistas-offline-mvp301.ts'
      - 'tests/unit/mvp301-plan-finalistas-offline.test.mjs'
      - 'scripts/piloto/mvp301-*'
      - 'docs/427-*'
      - '.github/workflows/cotironda-mvp301-offline-finalistas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-circuit-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Full offline circuit and finalist coverage regression
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp284-edge-roundtrip.test.mjs \
            tests/unit/mvp284-e2e-contract.test.mjs \
            tests/unit/mvp301-plan-finalistas-offline.test.mjs \
            tests/unit/mvp300-pilot-e2e-readonly-gate.test.mjs \
            tests/unit/mvp299-pending-coverage.test.mjs \
            tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs \
            tests/unit/mvp196-seleccion-v9-cierre.test.mjs
# Offline fixtures only. Do not call Supabase/Whapi/OpenAI/WhatsApp,
# create pilots, write secrets or activate finalists in this workflow.

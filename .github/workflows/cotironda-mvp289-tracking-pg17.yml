name: Cotironda MVP289 - confirmacion y seguimiento
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'supabase/functions/cotironda-piloto-whapi/buyer-tracking-confirmation-mvp289.ts'
      - 'supabase/piloto/mvp289_*'
      - 'supabase/tests/ci/mvp289-*'
      - 'scripts/piloto/mvp289-*'
      - 'tests/unit/mvp289-*'
      - '.github/workflows/cotironda-mvp289-tracking-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-tracking-and-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Node: confirmacion, idempotencia y regresiones de PDF
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp289-buyer-tracking-confirmation.test.mjs \
            tests/unit/mvp288-fidelidad-presentaciones.test.mjs \
            tests/unit/mvp288-correction-security-contract.test.mjs \
            tests/unit/mvp279-buyer-whatsapp-review.test.mjs \
            tests/unit/mvp091-solicitud-pdf.test.mjs
          node scripts/piloto/mvp289-buyer-tracking-builder.mjs --assert-local
      - name: PG17: RPC privada, aprobacion y cero duplicaciones, ROLLBACK
        run: |
          set -euo pipefail
          node scripts/piloto/mvp289-buyer-tracking-builder.mjs --sql > supabase/tests/ci/.mvp289.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp289.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp289.sql
# No acceso a Whapi, Vercel ni Supabase real en CI.

name: Cotironda IA Central etapa 7 - protocolo privado incidentes MVP265
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp265_supervisor_operator_casebook.sql'
      - 'supabase/tests/ci/mvp265-supervisor-operator-pg17.sql'
      - 'tests/unit/mvp265-supervisor-operator-workflow.test.mjs'
      - '.github/workflows/cotironda-mvp265-operator-incidents.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-incidentes-operador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'PG17: no cierre ficticio, SLA, operator access, episodios y reabrir'
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/ci/mvp265-supervisor-operator-pg17.sql
  node-incident-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Node: prohibir envíos, adjudicación y cerrar una alerta activa'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp265-supervisor-operator-workflow.test.mjs
          tests/unit/mvp263-supervisor-watchdog-gated.test.mjs
          tests/unit/mvp262-supervisor-ia-central-readonly.test.mjs
# No external provider, no WhatsApp, no PILOT deployment.

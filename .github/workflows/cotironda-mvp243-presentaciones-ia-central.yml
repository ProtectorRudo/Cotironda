name: Cotironda — etapa 3 diagnóstico de envases MVP243
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/diagnostico-presentaciones-mvp243.ts'
      - 'src/domain/ia-central/calificador-cotizaciones-mvp225.ts'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-supplier-mvp227.ts'
      - 'tests/unit/mvp243-presentaciones-nominales-ia-central.test.mjs'
      - '.github/workflows/cotironda-mvp243-presentaciones-ia-central.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 'MVP243 + regresión equivalencias comerciales fuente privada'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp243-presentaciones-nominales-ia-central.test.mjs
          tests/unit/mvp174-cemento-hidrofugo-presentaciones.test.mjs
          tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs
          tests/unit/mvp225-lector-ia-presupuestos.test.mjs
          tests/unit/mvp227-recepcion-presupuesto-evaluado.test.mjs
          tests/unit/mvp241-evidencia-monetaria-cantidades.test.mjs
          tests/unit/mvp242-condiciones-iva-flete-pago.test.mjs

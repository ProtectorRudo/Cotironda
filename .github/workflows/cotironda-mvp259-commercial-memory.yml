name: Cotironda IA Central etapa 6 - memoria comercial aislada MVP259
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp259_commercial_memory_scoped.sql'
      - 'supabase/tests/ci/mvp259-commercial-memory-pg17.sql'
      - 'tests/unit/mvp259-memoria-comercial-aislada.test.mjs'
      - '.github/workflows/cotironda-mvp259-commercial-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-memoria-aislada:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'MVP259: ronda, consentimiento, nuevo proveedor, quote viejo, TTL y ACL'
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/ci/mvp259-commercial-memory-pg17.sql
  node-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Node: aislamiento de contexto y contratos anteriores'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp259-memoria-comercial-aislada.test.mjs
          tests/unit/mvp254-corpus-etapas-123.test.mjs
          tests/unit/mvp255-seguimiento-comparador-rubros.test.mjs
# No deploy, no LLM, no WhatsApp.

name: Cotironda PILOTO reconciliation PostgreSQL17
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp134_private_quote_reconciliation.sql'
      - 'supabase/tests/ci/mvp134-reconciliation.sql'
      - '.github/workflows/cotironda-piloto-reconciliation-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp134-reconciliation.sql > /dev/null

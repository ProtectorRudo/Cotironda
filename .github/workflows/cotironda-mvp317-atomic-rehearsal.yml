name: MVP317 - instalacion atomica sin afectar al piloto
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'scripts/piloto/mvp317-*'
      - 'supabase/tests/ci/mvp317-*'
      - 'supabase/piloto/mvp30*.sql'
      - 'supabase/piloto/mvp31*.sql'
      - 'docs/447-*'
      - '.github/workflows/cotironda-mvp317-atomic-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback-and-full-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Replay existing MVP309-315 synthetic regression suite with ROLLBACK
        run: |
          node scripts/piloto/mvp315-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp315-generated-pg17.sql >/dev/null
      - name: Verify failure injection rolls back all schema changes
        run: bash scripts/piloto/mvp317-ensayo-atomico-pg17.sh
# NO Supabase secrets, remote connection or Whapi in this workflow.

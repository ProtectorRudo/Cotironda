name: Versionar cuarta migracion Supabase dev
on:
  push:
    branches: [feat/01-authenticated-rpc-registration]
permissions:
  contents: write
jobs:
  migration:
    if: github.repository == 'ProtectorRudo/Cotironda'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Generar migracion con CLI y versionar SQL revisado
        id: gen
        run: |
          set -euo pipefail
          target="supabase/migrations/20261029120021_jwt_bound_registration_locked.sql"
          if [[ -f "$target" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new jwt_bound_registration_locked
          generated="$(find supabase/migrations -maxdepth 1 -name '*_jwt_bound_registration_locked.sql' ! -name '20261029120021_jwt_bound_registration_locked.sql' | sort | tail -n1)"
          test -n "$generated"
          mv "$generated" "$target"
          cp supabase/changes/04_jwt_bound_registration.sql "$target"
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Publicar migracion en rama privada de desarrollo
        if: steps.gen.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/cotironda-migration.json',JSON.stringify({message:'docs(db): registrar migracion JWT de Cotironda dev',content:fs.readFileSync('supabase/migrations/20261029120021_jwt_bound_registration_locked.sql').toString('base64'),branch:process.env.BRANCH}))"
          gh api --method PUT "repos/$REPO/contents/supabase/migrations/20261029120021_jwt_bound_registration_locked.sql" --input /tmp/cotironda-migration.json > /dev/null
          rm -f /tmp/cotironda-migration.json

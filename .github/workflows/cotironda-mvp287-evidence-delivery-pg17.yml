name: Cotironda MVP287 - equivalencia fuente y estado Whapi
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'src/domain/ia-central/contrato-v1.ts'
      - 'tests/unit/mvp287-*'
      - 'supabase/functions/cotironda-piloto-whapi/*mvp286*'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'supabase/piloto/mvp287_*'
      - 'supabase/tests/ci/mvp287-*'
      - 'scripts/piloto/mvp287-*'
      - '.github/workflows/cotironda-mvp287-evidence-delivery-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-evidence-and-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contratos de fuente y Whapi sin I/O externo
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp287-semantic-evidence-equivalence.test.mjs \
            tests/unit/mvp287-whapi-delivery-guard.test.mjs \
            tests/unit/mvp216-ia-central-rubros.test.mjs
          node scripts/piloto/mvp287-reader-delivery-builder.mjs --assert-local
      - name: PostgreSQL 17 completo, un rollback
        run: |
          set -euo pipefail
          node scripts/piloto/mvp287-reader-delivery-builder.mjs --sql > supabase/tests/ci/.mvp287.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp287.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp287.sql
# No Whapi connection, no production access, no outgoing messages.

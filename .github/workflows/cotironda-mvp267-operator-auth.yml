name: Cotironda IA Central etapa 7 - operador Auth real MFA MVP267
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp267_operator_supabase_auth_mfa_bridge.sql'
      - 'supabase/tests/ci/mvp267-operator-supabase-auth-pg17.sql'
      - 'tests/unit/mvp267-operator-auth-contract.test.mjs'
      - 'tests/unit/mvp267-operator-http-boundary.test.mjs'
      - 'src/server/operador-piloto-http-mvp267.ts'
      - 'apps/portal/lib/piloto-operador-cliente.ts'
      - 'apps/portal/lib/piloto-operador-http.ts'
      - 'apps/portal/app/api/piloto/operador/**'
      - '.github/workflows/cotironda-mvp267-operator-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-sesion-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'PG17: JWT, AAL2, sesiones cerradas, revocación y ACL'
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/ci/mvp267-operator-supabase-auth-pg17.sql
  http-contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Node: endpoints protegidos, aislamiento y costos no inventados'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp267-operator-auth-contract.test.mjs
          tests/unit/mvp267-operator-http-boundary.test.mjs
# No real OAuth, MFA provision, Supabase PILOT migration, Whapi or cron.

name: Cotironda D022 - perfil comercial privado (sin publicar)
on:
  push:
    branches:
      - feat/d022-ficha-comercial-proveedor-20261122
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: d022-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout fuente exacta, sin credenciales persistidas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Unitarias D022 y regresión D016 en código real
        run: node --experimental-strip-types --test tests/unit/v2-shared-history.test.mjs tests/unit/mvp227-recepcion-presupuesto-evaluado.test.mjs tests/unit/v2-d022-perfiles-proveedores.test.mjs tests/unit/v2-d016-rutas-portal.test.mjs tests/unit/v2-d016-sesion-privada.test.mjs tests/unit/v2-d016-enlace-whatsapp.test.mjs tests/unit/v2-d023-contact.test.mjs tests/unit/v2-d016-resumen-comercial.test.mjs tests/unit/v2-d016-informe-final.test.mjs
      - name: Probar enlace canónico con los módulos exactos del recuperador v59
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync,copyFileSync} from 'node:fs';
          import {dirname,resolve} from 'node:path';
          import assert from 'node:assert/strict';
          const j=JSON.parse(readFileSync('supabase/piloto/v2_document_recovery_canonical_link_CANDIDATE.json','utf8'));
          assert.equal(j.base.version,59);
          assert.equal(j.base.file_count,30);
          assert.equal(j.files.length,3);
          const root=resolve(process.env.RUNNER_TEMP,'cotironda-link-candidate');
          for(const f of j.files){
            assert.match(f.path,/^supabase\/functions\/cotironda-piloto-(?:whapi|document-recovery)\/[a-z0-9-]+\.ts$/);
            const p=resolve(root,f.path);
            assert.ok(p.startsWith(root+'/'));
            mkdirSync(dirname(p),{recursive:true});writeFileSync(p,f.content);
          }
          mkdirSync(root+'/tests/unit',{recursive:true});
          copyFileSync('tests/unit/v2-d016-automatic-buyer-link-vault.test.mjs',root+'/tests/unit/v2-d016-automatic-buyer-link-vault.test.mjs');
          NODE
          node --experimental-strip-types --test "$RUNNER_TEMP/cotironda-link-candidate/tests/unit/v2-d016-automatic-buyer-link-vault.test.mjs"
      - name: PostgreSQL 17 - SQL candidato, RLS, consentimiento y revocación
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d022-profile-pg17.sql
      - name: PostgreSQL 17 - D023, contacto cifrado y revocación comprobados
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-d023-contact-pg17.sql
      - name: Instalar dependencias exactas (lockfile portal)
        run: npm ci --prefix apps/portal --no-audit --no-fund
      - name: Typecheck Next.js portal
        run: npm run typecheck --prefix apps/portal
      - name: Build completo Next.js portal, sin publicar
        run: npm run build --prefix apps/portal

      - name: Reportar estado de este CI al commit, sin despliegues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="D022: unitarias, PG17, tipos y Next build correctos"
          else
            state=failure
            description="D022: hay pruebas por corregir, NO publicar"
          fi
          curl --fail --silent --show-error --retry 2 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"cotironda/D022-build-and-safety\",\"description\":\"$description\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" >/dev/null

  whapi-candidate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout fuente exacta sin credenciales
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Deno 2
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Materializar base v119 y candidato comercial integrado (86 fuentes)
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {dirname,resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const j=JSON.parse(readFileSync('supabase/piloto/v2_catalogue_recovery_v118_CANDIDATE.json','utf8'));
          assert.equal(j.base.version,118);
          assert.equal(j.base.file_count,76);
          assert.equal(j.base_unchanged.length,63);
          assert.equal(j.files.length,18);
          const root=resolve(process.env.RUNNER_TEMP,'cotironda-whapi-candidate');
          const seen=new Set();
          const put=(path,bytes)=>{
            assert.match(path,/^(src\/domain\/|supabase\/functions\/)[a-zA-Z0-9_./-]+\.ts$/);
            assert.ok(!path.split('/').includes('..')&&!seen.has(path));
            seen.add(path);
            const target=resolve(root,path);
            assert.ok(target.startsWith(root+'/'));
            mkdirSync(dirname(target),{recursive:true});
            writeFileSync(target,bytes);
          };
          for(const f of j.base_unchanged){
            const bytes=readFileSync(f.path);
            const digest=createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
            assert.equal(digest,f.git_blob_sha,'Base v118 modificada: '+f.path);
            put(f.path,bytes);
          }
          for(const f of j.files)put(f.path,f.content);
          assert.equal(seen.size,81);
          // Base v119: los 18 overlays del release v118 y 63 blobs exactos
          // fueron contrastados byte por byte con la función desplegada.
          const c=JSON.parse(readFileSync('supabase/piloto/v2_commercial_integrated_v119_CANDIDATE.json','utf8'));
          assert.equal(c.base.version,119);
          assert.equal(c.base.ezbr_sha256,'92a4ac176f5db35b8694a7543c20c180a1553c99d9a9d7a097faad58ae25e741');
          assert.equal(c.files.length,11);
          const overlay=new Set();
          for(const f of c.files){
            assert.match(f.path,/^(src\/domain\/|supabase\/functions\/)[a-zA-Z0-9_./-]+\.(?:ts|mjs)$/);
            assert.ok(!f.path.split('/').includes('..')&&!overlay.has(f.path));
            overlay.add(f.path);
            const target=resolve(root,f.path);
            assert.ok(target.startsWith(root+'/'));
            mkdirSync(dirname(target),{recursive:true});
            writeFileSync(target,f.content);
            seen.add(f.path);
          }
          assert.equal(seen.size,86);
          console.log('86 fuentes exactas: base v119 y 11 overlays comerciales; no se ejecuta el webhook.');
          NODE
      - name: Typecheck Deno del candidato comercial completo sin despliegue
        run: |
          cd "$RUNNER_TEMP/cotironda-whapi-candidate"
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.ts

      - name: Ejecutar worker comercial exacto con dos compradores y cifrado real (sin red)
        run: |
          cd "$RUNNER_TEMP/cotironda-whapi-candidate"
          cat > commercial-worker-smoke.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import {procesarConversacionV2} from './supabase/functions/cotironda-piloto-whapi/buyer-conversation-worker-v2.ts';
          const enc=new TextEncoder(),dec=new TextDecoder();
          const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s))),x=>x.toString(16).padStart(2,'0')).join('');
          const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
          const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
          const encrypt=async(s,aad)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return {nonce:b64(iv),ciphertext:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(aad)},key,enc.encode(s)))}};
          const decrypt=async(n,c,aad)=>dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(n),additionalData:enc.encode(aad)},key,unb64(c)));
          const catalogue=Array.from({length:28},(_,i)=>({clave:'synthetic_supplier_'+String(i).padStart(2,'0'),localidad:'La Plata',catalogoConfirmado:true,articulos:[{numero:1,descripcion:i<14?'cemento':'cable',familiaAnterior:null,revisionAnterior:'pending_review'}]}));
          async function fixture(label){
           const chat=await sha('chat'+label),msg=await sha('msg'+label),id=crypto.randomUUID(),source='10 bolsas cemento\n20 metros cable\nEntrega en La Plata';
           const hash=await sha(source), manifest=await sha(msg+':'+hash+':text'),envelope=await encrypt(source,chat+'|'+msg+'|text');
           let lease='',cp=null,seq=0,reserved=false,staged=null,readCount=0,routeCount=0,done=false,failReason='',rpcNames=[];
           const result=data=>({data,error:null});
           const rpc=async(name,p)=>{
            rpcNames.push(name);
            if(p.p_chat_hmac!==undefined)assert.equal(p.p_chat_hmac,chat);
            if(p.p_buyer_chat_hmac!==undefined)assert.equal(p.p_buyer_chat_hmac,chat);
            if(p.p_id!==undefined)assert.equal(p.p_id,id);
            if(name==='cotironda_piloto_v2_conversation_claim'){if(done)return result({state:'not_due'});lease=crypto.randomUUID();return result({state:'claimed',conversation_id:id,revision:1,lease,sources:[{message_hmac:msg,source_sha256:hash,kind:'text',...envelope}]});}
            if(name==='cotironda_piloto_v2_commercial_checkpoint'){
             assert.equal(p.p_lease,lease);
             if(p.p_action==='load')return result(cp?{state:'snapshot',manifest,cursor:cp.cursor,total:cp.total,nonce:cp.nonce,ciphertext:cp.ciphertext}:{state:'none',manifest});
             assert.equal(p.p_manifest,manifest);assert.equal(p.p_expected,cp?.cursor??-1);assert.equal(reserved,false);
             cp={cursor:p.p_expected+1,total:p.p_total,nonce:p.p_nonce,ciphertext:p.p_ciphertext};return result({state:p.p_pause?'queued':'saved',cursor:cp.cursor});
            }
            if(name==='cotironda_piloto_v2_conversation_meter'||name==='cotironda_piloto_v2_commercial_meter')return result({state:'reserved',message_hmac:msg,usage_call_no:seq,max_calls:cp?32:8,lease_until_ms:Date.now()+240000});
            if(name==='cotironda_piloto_v2_conversation_zone_resume')return result({state:'none'});
            if(name==='cotironda_piloto_v2_commercial_catalogue')return result({state:'catalogue_snapshot',localidad:'La Plata',proveedores:catalogue,proveedoresSinConfirmar:0});
            if(name.endsWith('usage_reserve')||name.endsWith('usage_reserve_mvp264')){assert.equal(p.p_call_no,seq+1);assert.equal(reserved,false);reserved=true;seq++;return result({state:'reserved'});}
            if(name.endsWith('usage_finish_mvp264')){assert.equal(p.p_call_no,seq);assert.equal(reserved,true);reserved=false;return result({state:'recorded'});}
            if(name==='cotironda_piloto_v2_commercial_history_d013')return result([]);
            if(name==='cotironda_piloto_v2_commercial_stage'){assert.equal(cp.cursor,cp.total);assert.equal(staged,null);staged=p;return result({state:'shadow_staged'});}
            if(name==='cotironda_piloto_v2_conversation_finish'){done=true;failReason=p.p_reason;return result({state:p.p_decision,reply_reserved:false});}
            if(name==='cotironda_piloto_v2_conversation_decide'){failReason=p.p_decision;done=true;return result({state:p.p_decision});}
            throw Error('unexpected_rpc:'+name);
           };
           const usageFetchImpl=async(url,init)=>{
            assert.equal(url,'https://api.openai.com/v1/responses');assert.equal(reserved,true);
            const body=JSON.parse(init.body);assert.equal(body.store,false);assert.deepEqual(body.tools,[]);
            let data;
            if(body.text.format.name==='cotironda_ai_central_lector_v2_d013'){
             readCount++;data={intencion:'cotizar',zona_entrega:'La Plata',accion:'pedido',pago:null,iva:null,dudas:[],aclaracion_esencial:false,articulos:[
              {evidencia:'10 bolsas cemento',descripcion:'cemento',cantidad:'10',unidad:'bag',rubro:'obra_gruesa',rubroComercial:'corralon',presentacion:null,aclaracion:null,citaCantidad:'10',citaProducto:'cemento',citaPresentacion:null},
              {evidencia:'20 metros cable',descripcion:'cable',cantidad:'20',unidad:'m',rubro:'electricidad',rubroComercial:'electricidad',presentacion:null,aclaracion:null,citaCantidad:'20',citaProducto:'cable',citaPresentacion:null}]};
            }else{
             assert.equal(body.text.format.name,'cotironda_ruteo_catalogos_v2');routeCount++;
             const input=JSON.parse(body.input[1].content[0].text.split('\n').slice(1).join('\n'));
             data={propuestas:input.proveedores.map(p=>({proveedor:p.clave,correspondencias:[{indicePedido:p.catalogo[0].descripcion==='cemento'?0:1,numeroCatalogo:1,tipo:'producto_declarado',explicacion:'Producto declarado'}]}))};
            }
            return new Response(JSON.stringify({id:'resp_synthetic_'+label+'_'+seq,status:'completed',usage:{input_tokens:100,output_tokens:20,total_tokens:120},output:[{type:'message',role:'assistant',content:[{type:'output_text',text:JSON.stringify(data)}]}]}));
           };
           const io={rpc,apiKey:'sk-synthetic-only-000000000000000000',model:'gpt-6.1-sol',commercialEnabled:true,sha,encrypt,decrypt,usageFetchImpl,sendClarification:async()=>{throw Error('unexpected clarification')}};
           return {run:()=>procesarConversacionV2(chat,id,io),get:()=>({cp,seq,readCount,routeCount,staged,failReason,rpcNames,chat,id,done})};
          }
          const a=await fixture('a'),b=await fixture('b');
          for(let i=0;i<5;i++){
           const states=await Promise.all([a.run(),b.run()]);
           console.log('iteration',i,states, [a.get().failReason,b.get().failReason]);
           if(states.every(s=>s==='staged'))break;
           assert.ok(states.every(s=>s==='queued'),'worker must resume: '+JSON.stringify(states));
          }
          for(const f of [a,b]){
           const x=f.get();assert.equal(x.done,true);assert.equal(x.readCount,1);assert.equal(x.routeCount,2);assert.equal(x.seq,3);assert.equal(x.staged.p_destinos.length,14);
           assert.deepEqual(x.staged.p_rubros,['corralon','electricidad']);
           assert.equal(x.staged.p_items.length,2);assert.equal(new Set(x.staged.p_destinos.map(d=>d.proveedor)).size,14);
           assert.equal(x.staged.p_buyer_chat_hmac,x.chat);
          }
          const x=a.get(),y=b.get();
          assert.notEqual(x.chat,y.chat);
          await assert.rejects(()=>decrypt(x.cp.nonce,x.cp.ciphertext,[y.chat,y.id,1,'0'.repeat(64),x.cp.cursor,'commercial-v2-1'].join('|')));
          console.log('PASS exact worker: two buyers, AES-GCM, one reader each, 2 routing batches, 14 selected each, no transport.');
          TEST
          deno run --node-modules-dir=auto --no-prompt commercial-worker-smoke.mjs

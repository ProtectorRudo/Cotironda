name: Actualizar lockfile del portal tras quitar pg
on:
  push:
    branches: [feat/01-authenticated-rpc-registration]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'ProtectorRudo/Cotironda'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Regenerar sin scripts arbitrarios
        working-directory: apps/portal
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lock solo si cambió
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/package-lock.json; then
            echo "Lockfile actualizado previamente"
            exit 0
          fi
          current_sha="$(gh api "repos/$REPO/contents/apps/portal/package-lock.json?ref=$BRANCH" --jq '.sha')"
          CURRENT_SHA="$current_sha" node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/cotironda-lock.json',JSON.stringify({message:'chore(portal): actualizar lockfile tras eliminar pg',content:fs.readFileSync('apps/portal/package-lock.json').toString('base64'),sha:process.env.CURRENT_SHA,branch:process.env.BRANCH}))"
          gh api --method PUT "repos/$REPO/contents/apps/portal/package-lock.json" --input /tmp/cotironda-lock.json > /dev/null
          rm -f /tmp/cotironda-lock.json

name: PostgreSQL 17 - Aislamiento por empresa
on:
  pull_request:
  push:
    branches: [main, feat/01-identidad-catalogos-rls]
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci_only_password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PostgreSQL disponible
        run: psql --version && pg_isready
      - name: Ejecutar esquema y pruebas de aislamiento
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/00_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/10_tenant_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/20_onboarding.sql
      - name: Probar dos registros simultáneos
        run: bash supabase/tests/ci/30_concurrency.sh
      - name: Validar rol limitado sin login ni bypass RLS
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029111731_backend_role_limited.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/40_backend_role.sql
      - name: Alta solo por función privada y rol sin DML
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029112947_execute_only_registration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/50_execute_only.sql
      - name: Registro derivado de JWT, sin p_user_id
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029120021_jwt_bound_registration_locked.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/60_jwt_bound_registration.sql
      - name: RPC invoker, hook correo y privilegios limitados
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029122708_invoker_verified_email_hook.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/70_invoker_email_hook.sql
      - name: Sesiones revocadas, suspendidas y correo actual
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029130907_session_revocation_and_verified_user.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/80_session_revocation.sql

      - name: Cuotas por usuario con rechazo durable y RPC directa
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029140422_registration_attempt_rate_limiter.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/91_rate_limit.sql
      - name: "Cuarenta sesiones concurrentes: cuota ineludible"
        run: bash supabase/tests/ci/92_rate_limit_concurrency.sh
      - name: Revocacion post-migracion 7 con estado estructurado
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/93_revoked_session_status.sql
      - name: Storage privado y aislamiento por empresa (migracion 8)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029183835_storage_private_buyer_drafts.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/94_storage_private_tenant.sql
      - name: Revocacion de sesion Auth en RLS Storage (migracion 9)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029202610_storage_session_revocation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/95_storage_session_revocation.sql
      - name: Bloquear INSERT directo de archivos sin antivirus (migracion 10)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029213500_storage_upload_fail_closed.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/96_storage_direct_upload_disabled.sql

  migrations-from-zero:
    name: Reconstruir historial 7 migraciones en PostgreSQL limpio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cotironda_ci_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci_fresh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci_only_password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: cotironda_ci_fresh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Emular solamente roles Supabase en PostgreSQL efímero
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/00_bootstrap.sql
      - name: Aplicar las 10 migraciones HISTÓRICAS desde cero y en orden
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if [[ "${#migrations[@]}" -ne 10 ]]; then
            echo 'ERROR: número de migraciones inesperado, revisar historial dev' >&2
            exit 1
          fi
          for file in "${migrations[@]}"; do
            if [[ "${file}" == *"20261029213500_storage_upload_fail_closed.sql" ]]; then
              echo 'Validando contratos históricos de carga antes del cierre de INSERT'
              psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/94_storage_private_tenant.sql > /dev/null
              psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/95_storage_session_revocation.sql > /dev/null
            fi
            echo "Aplicando ${file}"
            psql -X -v ON_ERROR_STOP=1 -f "${file}" > /dev/null
          done
      - name: Comprobar guard y privilegios de la cadena reconstruida
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          select ci_helpers.assert_true(
            (select enabled=false from cotironda_private.registration_settings where singleton=true),
            'registro no debe estar habilitado tras migraciones');
          select ci_helpers.assert_true(
            not has_table_privilege('authenticated',
              'cotironda_private.registration_attempt_quotas','SELECT'),
            'usuario no puede leer cuota privada');
          select ci_helpers.assert_true(
            not has_function_privilege('anon',
              'public.register_company_for_current_user(uuid,text,text,text)','EXECUTE'),
            'usuario anonimo no puede ejecutar alta');
          select ci_helpers.assert_true(
            not (select prosecdef from pg_proc
                 where oid='public.register_company_for_current_user(uuid,text,text,text)'::regprocedure),
            'RPC publica debe ser invoker');
          SQL
      - name: Probar alta, idempotencia, sesión revocada y cuota sobre migraciones reales
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/91_rate_limit.sql
      - name: Cuarenta intentos concurrentes sobre historial reconstruido
        run: bash supabase/tests/ci/92_rate_limit_concurrency.sh
      - name: Revocacion y JWT antiguo con RPC estructurada
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/93_revoked_session_status.sql
      - name: Storage fail-closed tras reconstruir 10 migraciones
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/96_storage_direct_upload_disabled.sql
      - name: 'Verificar limpieza final: flag apagado y cero datos de pruebas'
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          select ci_helpers.assert_true(
            (select enabled=false from cotironda_private.registration_settings where singleton=true),
            'flag SQL debe quedar apagado tras test concurrente');
          select ci_helpers.assert_true(
            (select count(*) from auth.users)=0 and
            (select count(*) from auth.sessions)=0 and
            (select count(*) from public.organizations)=0 and
            (select count(*) from cotironda_private.registration_attempt_quotas)=0 and
            (select count(*) from storage.objects)=0 and
            (select public=false from storage.buckets where id='cotironda-buyer-drafts'),
            'datos sintéticos de pruebas deben limpiarse');
          SQL

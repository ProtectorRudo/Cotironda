name: Pruebas unitarias de Cotironda
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: ''
      - name: Pruebas de dominio y estructura
        run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - name: D037 integridad SHA256 de cinco migraciones IA alojadas, sin ejecutar SQL
        run: node scripts/ci/verify-dev-ai-migration-sources-d037.mjs

      # Solo PR de la rama exacta en este repositorio. Una única consulta GET
      # pública, sin usuarios/contraseñas/JWT. FAIL si Auth admite signup.
      - name: Auditar Auth remoto de Cotironda DEV - solo lectura
        if: >-
          ${{ github.event_name == 'pull_request' &&
              github.head_ref == 'security/01-auth-settings-remote-probe' &&
              github.event.pull_request.head.repo.full_name == 'ProtectorRudo/Cotironda' }}
        env:
          COTIRONDA_CI_AUTH_REMOTE: 'true'
          # Key publishable pública y ya presente en el cliente de prueba.
          COTIRONDA_DEV_PUBLISHABLE_KEY: 'sb_publishable_7Hw2C8N5ga2-b4eHdXMa2Q_jKeSPhio'
        run: node --experimental-strip-types scripts/ci/auth-settings-remote-probe.mjs

  pg17-mvp354-documental:
    # Asegura ejecución en el PR técnico aun si el nuevo workflow
    # específico no está en la rama base de GitHub. Sin credenciales PILOTO.
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'feat/mvp354-document-receipt-status-20261111' || github.head_ref == 'fix/mvp355-receipt-source-provenance-20261111' || github.head_ref == 'fix/mvp356-guard-despachos-solapados-piloto-20261112' || github.head_ref == 'feat/mvp357-batch-retry-cron-piloto-20261112') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: RPC MVP354 en PostgreSQL 17 con rollback garantizado
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp354-document-receipts-pg17.sql
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_document_receipts_mvp354(text)') IS NULL" | grep -Fx 't'

  deno-mvp354-seguimiento:
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'feat/mvp354-document-receipt-status-20261111' || github.head_ref == 'fix/mvp355-receipt-source-provenance-20261111' || github.head_ref == 'fix/mvp356-guard-despachos-solapados-piloto-20261112' || github.head_ref == 'feat/mvp357-batch-retry-cron-piloto-20261112') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Deno check tracking completo MVP354
        run: deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-seguimiento/index.ts

  pg17-mvp356-claim-anti-solapamientos:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/mvp356-guard-despachos-solapados-piloto-20261112' || github.head_ref == 'feat/mvp357-batch-retry-cron-piloto-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Las dos rutas de despacho rechazan ronda solapada con rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp356-dispatch-overlap-pg17.sql
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_ia_claim_mvp222(uuid)') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_ia_claim_mvp314(uuid)') IS NULL" | grep -Fx 't'

  pg17-mvp357-batch-retry:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/mvp357-batch-retry-cron-piloto-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: SQL selector y programador en PG17 SIN red real y con rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp357-scheduler-pg17.sql
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('vault') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_ia_next_batch_mvp314()') IS NULL" | grep -Fx 't'

  deno-mvp357-ai-batch:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/mvp357-batch-retry-cron-piloto-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Verificar Edge real del lote y validador body
        run: deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-ai-batch/index.ts

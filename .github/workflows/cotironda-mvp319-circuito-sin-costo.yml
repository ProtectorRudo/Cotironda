name: MVP319 - despacho y aviso sin costo, solo simulacion
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'tests/unit/mvp319-*'
      - 'docs/449-*'
      - '.github/workflows/cotironda-mvp319-circuito-sin-costo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run offline real-modules orchestration tests
        run: node --experimental-strip-types --test tests/unit/mvp319-piloto-sin-costo-parcial.test.mjs
# No PostgreSQL remote, Whapi, payment, API credentials or outbound HTTP.

name: MVP313 - destinatarios dinamicos cifrados por lease
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp313_destinatarios_dinamicos_cifrados.sql'
      - 'supabase/functions/cotironda-piloto-whapi/dynamic-recipient-mvp313.ts'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-dispatch-mvp223.ts'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'supabase/tests/ci/mvp313-recipient-lease-pg17.sql'
      - 'scripts/piloto/mvp313-generar-fixture-pg17.mjs'
      - 'tests/unit/mvp313-*'
      - '.github/workflows/cotironda-mvp313-dynamic-recipients.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipient-security:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Criptografia, lease, destinatario y revalidacion antes de Whapi
        run: |
          node --experimental-strip-types --test tests/unit/mvp313-dynamic-recipients.test.mjs
      - name: PostgreSQL17 - fail closed, rol, lease y permisos
        run: |
          set -euo pipefail
          node scripts/piloto/mvp313-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp313-generated-pg17.sql >/dev/null
# Sin Whapi real, Supabase real ni despliegue.

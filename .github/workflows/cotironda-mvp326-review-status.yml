name: MVP326 - estado real de revision comercial y privacidad
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp326_estado_revision_comercial_comprador.sql'
      - 'supabase/tests/ci/mvp326-review-stage-buyer-pg17.sql'
      - 'src/domain/ia-central/estado-revision-comercial-mvp326.ts'
      - 'supabase/functions/cotironda-piloto-seguimiento/index.ts'
      - 'piloto/seguimiento-web/site.js'
      - 'piloto/seguimiento-web/api/estado.js'
      - 'tests/unit/mvp326-revision-comercial.test.mjs'
      - '.github/workflows/cotironda-mvp326-review-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estados-de-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Casos de UI, proxy, privacidad y adaptador
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp326-revision-comercial.test.mjs
          tests/unit/mvp299-pending-coverage.test.mjs
          tests/unit/mvp322-preliminar-cotizaciones-anonimas.test.mjs
      - name: PostgreSQL17 autentico - estados de fuente, links revocados y ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp326-review-stage-buyer-pg17.sql > /dev/null
      - name: Sintaxis JavaScript client y proxy
        run: |
          node --check piloto/seguimiento-web/site.js
          node --check piloto/seguimiento-web/api/estado.js
# PostgreSQL efimero y Node sin credenciales, sin mensajes WhatsApp ni IA pagada.

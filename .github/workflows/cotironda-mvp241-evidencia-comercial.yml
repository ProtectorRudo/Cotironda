name: Cotironda — etapa 3 evidencia comercial MVP241
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/evidencia-moneda-mvp241.ts'
      - 'src/domain/ia-central/lector-presupuesto-proveedor-mvp225.ts'
      - 'src/domain/ia-central/calificador-cotizaciones-mvp225.ts'
      - 'tests/unit/mvp241-evidencia-monetaria-cantidades.test.mjs'
      - 'tests/unit/mvp225-lector-ia-presupuestos.test.mjs'
      - 'tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs'
      - '.github/workflows/cotironda-mvp241-evidencia-comercial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 'MVP241 + regresión de semántica comercial/reader MVP225/MVP227'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp241-evidencia-monetaria-cantidades.test.mjs
          tests/unit/mvp225-lector-ia-presupuestos.test.mjs
          tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs
          tests/unit/mvp227-recepcion-presupuesto-evaluado.test.mjs

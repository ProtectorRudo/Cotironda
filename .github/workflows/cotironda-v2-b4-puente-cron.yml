name: Cotironda V2 B4 - puente seguro cron existente
on:
  pull_request:
    branches:
      - feat/presupuestos-v2-b3-edge-privado
    paths:
      - 'supabase/functions/cotironda-piloto-auto-recovery/**'
      - 'supabase/piloto/v2_b4*'
      - 'supabase/tests/ci/v2-b2*'
      - 'tests/unit/presupuestos-v2-b4-*'
      - '.github/workflows/cotironda-v2-b4-puente-cron.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: |
          node --experimental-strip-types --test \
            tests/unit/presupuestos-v2-b4-puente-cron.test.mjs \
            tests/unit/presupuestos-v2-b3-integracion-privada.test.mjs \
            tests/unit/presupuestos-v2-b3-edge-handler.test.mjs \
            tests/unit/presupuestos-v2-worker-archivo-sombra.test.mjs \
            tests/unit/mvp292-archive-auto-recovery.test.mjs \
            tests/unit/mvp293-scheduled-recovery-bridge.test.mjs
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cotironda-piloto-auto-recovery/index.ts \
            supabase/functions/cotironda-piloto-v2-shadow/index.ts
  postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -tA \
            -f supabase/tests/ci/v2-b2-shadow-archive-ledger-rollback.sql \
            | grep -Fx 't'
          psql -X -tA -c "select to_regnamespace('cotironda_piloto_privado') is null" | grep -Fx 't'
# Synthetic only. NEVER trigger live cron, OpenAI, WhatsApp or Storage.

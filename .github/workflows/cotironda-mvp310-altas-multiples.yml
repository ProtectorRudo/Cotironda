name: MVP310 - multiples compradores proveedores autorizacion administrada
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp310_altas_multiples_admin_roles.sql'
      - 'supabase/tests/ci/mvp310-multi-participant-pg17.sql'
      - 'supabase/tests/ci/mvp309-owner-attestation-pg17.sql'
      - 'scripts/piloto/mvp310-generar-fixture-pg17.mjs'
      - 'tests/unit/mvp310-*'
      - '.github/workflows/cotironda-mvp310-altas-multiples.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-administration:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Node contratos de permisos y separación por rol
        run: |
          node --test tests/unit/mvp310-multi-admin-enrollment.test.mjs tests/unit/mvp309-admin-attestation.test.mjs
      - name: PostgreSQL17 sintético - participantes y rondas multi comprador
        run: |
          set -euo pipefail
          node scripts/piloto/mvp310-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp310-generated-pg17.sql >/dev/null
# Sin Supabase real ni Whapi; ensayo termina en ROLLBACK.

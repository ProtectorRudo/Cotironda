name: Cotironda B5f - total PDF y descuentos por evidencia independiente
on:
  pull_request:
    branches:
      - feat/v2-b6-comparacion-privada-sin-totales-enganosos-20261110
    paths:
      - 'src/domain/presupuestos-v2/**'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-source-pdf-general.ts'
      - 'tests/unit/presupuestos-v2-*'
      - 'tests/deno/b5f-geometria-pdf-real.test.ts'
      - 'docs/494-v2-b5f-cotejo-total-y-descuento-pdf-posicional.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md
      - 'supabase/functions/cotironda-piloto-v2-shadow/pdf-geometry-b5f.ts'
      - '.github/workflows/cotironda-v2-b5f-total-y-descuentos-posicional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-b5f-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Original PDF, discounts, B5 history, worker B2 and B5d
        run: |
          node --experimental-strip-types --test \
            tests/unit/presupuestos-v2-b5f-total-descuento-origen.test.mjs \
            tests/unit/presupuestos-v2-b5f-descuento-aritmetica-fuente.test.mjs \
            tests/unit/presupuestos-v2-evidencia-pdf-original-b5.test.mjs \
            tests/unit/presupuestos-v2-auditoria-comercial-b5.test.mjs \
            tests/unit/presupuestos-v2-b5-worker-pdf-evidence.test.mjs \
            tests/unit/presupuestos-v2-worker-revision-archivos-b5d.test.mjs
  deno-full-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Typecheck complete V2 Edge, pinned PDF.js
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cotironda-piloto-v2-shadow/index.ts
          deno test --allow-all --node-modules-dir=auto \
            tests/deno/b5f-geometria-pdf-real.test.ts
# No deploy, paid model, SQL mutations, WhatsApp or publication.

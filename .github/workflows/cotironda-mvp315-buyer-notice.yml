name: MVP315 - aviso unico al comprador tras despacho completo
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp315_aviso_comprador_post_despacho.sql'
      - 'supabase/functions/cotironda-piloto-ai-batch/index.ts'
      - 'supabase/functions/cotironda-piloto-whapi/buyer-tracking-after-batch-mvp315.ts'
      - 'supabase/functions/cotironda-piloto-whapi/buyer-tracking-confirmation-mvp289.ts'
      - 'tests/unit/mvp315-*'
      - 'scripts/piloto/mvp315-*'
      - 'supabase/tests/ci/mvp315-*'
      - '.github/workflows/cotironda-mvp315-buyer-notice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-notice-security:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: WebCrypto, one-time link, no buyer leak, revoked and uncertain
        run: |
          node --experimental-strip-types --test tests/unit/mvp315-buyer-notice-after-batch.test.mjs
          node --experimental-strip-types --test tests/unit/mvp306-auto-release-and-supplier-contacts.test.mjs
      - name: PostgreSQL17 - synthetic 309-315, all-accepted, budget, ROLLBACK
        run: |
          set -euo pipefail
          node scripts/piloto/mvp315-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp315-generated-pg17.sql >/dev/null
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno Edge private worker typecheck
        run: deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-ai-batch/index.ts
# No Supabase pilot writes, no WhatsApp, no real customers, no production.

name: Cotironda V2-04 - Analisis individual con evidencia
on:
  pull_request:
    paths:
      - 'src/server/v2-04-analisis-individual.ts'
      - 'tests/unit/v2-04-analisis-individual-evidencia.test.mjs'
      - '.github/workflows/cotironda-v2-04-analisis-individual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analisis-verificado:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Simular fuente autenticada, comentarios, seguridad y fallo IA
        run: node --experimental-strip-types --test tests/unit/v2-04-analisis-individual-evidencia.test.mjs

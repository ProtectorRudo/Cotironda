name: Cotironda IA Central — despacho aislado PG17

on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp222_ia_despacho_seguro_sin_activar.sql'
      - 'supabase/tests/ci/mvp222-ia-despacho-pg17-rollback.sql'
      - '.github/workflows/cotironda-ia-central-mvp222-despacho-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  despacho-sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: "Ejercitar publisher, gate OFF, tres PDFs aislados y leases una sola vez"
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp222-ia-despacho-pg17-rollback.sql > /dev/null

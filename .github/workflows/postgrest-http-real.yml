name: Etapa 01 - PostgREST HTTP autenticacion real en CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  postgrest-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cotironda_ci_http
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci_http"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: cotironda_ci_http
      COTIRONDA_POSTGREST_HTTP_CI: 'true'
    steps:
      - name: Checkout sin credenciales
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node LTS exacto
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Instalar las 11 migraciones en base PostgreSQL efimera, NO Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PGHOST" != '127.0.0.1' || "$PGDATABASE" != 'cotironda_ci_http' ]]; then
            echo 'ERROR: DB externa bloqueada' >&2
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/00_bootstrap.sql > /dev/null
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if [[ "${#migrations[@]}" != 11 ]]; then
            echo 'ERROR: migraciones inesperadas' >&2
            exit 1
          fi
          for file in "${migrations[@]}"; do
            psql -X -v ON_ERROR_STOP=1 -f "$file" > /dev/null
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL' > /dev/null
          create role cotironda_http_ci login password 'ci_http_only_password';
          grant anon,authenticated to cotironda_http_ci;
          grant usage on schema public to cotironda_http_ci;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/98_postgrest_http_fixture.sql > /dev/null
      - name: Generar clave JWT efimera exclusivamente en el runner CI
        shell: bash
        run: |
          set -euo pipefail
          echo "COTIRONDA_CI_JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Iniciar PostgREST real aislado sobre PostgreSQL temporal
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name cotironda-postgrest-ci \
            --network host \
            -e PGRST_DB_URI='postgres://cotironda_http_ci:ci_http_only_password@127.0.0.1:5432/cotironda_ci_http' \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_SERVER_PORT=3409 \
            -e PGRST_DB_CHANNEL_ENABLED=false \
            -e PGRST_JWT_SECRET="$COTIRONDA_CI_JWT_SECRET" \
            postgrest/postgrest@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
          ready=''
          for i in {1..50}; do
            if curl --max-time 2 --silent --fail http://127.0.0.1:3409/ > /dev/null; then
              ready=yes; break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' cotironda-postgrest-ci 2>/dev/null || true)" != 'true' ]]; then
              echo 'ERROR: PostgREST finalizo durante inicio' >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != yes ]]; then
            echo 'ERROR: PostgREST no esta disponible por HTTP' >&2
            exit 1
          fi
      - name: HTTP JWT autentico de PostgREST (NO Supabase Auth) 429 revocacion y limpieza
        run: node tests/integration/postgrest-http-real.mjs
      - name: Preparar empresas y roles ficticios para prueba HTTP de aislamiento
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/99_tenant_http_fixture.sql
      - name: Verificar RLS real via HTTP entre empresas y limpiar fixtures
        run: node tests/integration/postgrest-tenant-http-real.mjs
      - name: Apagar PostgREST efimero en todos los resultados
        if: always()
        shell: bash
        run: docker rm -f cotironda-postgrest-ci > /dev/null 2>&1 || true

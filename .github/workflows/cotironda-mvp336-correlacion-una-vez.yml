name: Cotironda MVP336 - documento sin unidades, retry seguro PG17
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/supplier-auto-correlation-mvp291.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-auto-correlation-mvp336.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-auto-recovery-worker-mvp292.ts'
      - 'supabase/piloto/mvp336_*'
      - 'supabase/tests/ci/mvp336-*'
      - 'scripts/piloto/mvp336-*'
      - 'tests/unit/mvp336-*'
      - 'tests/unit/mvp291-*'
      - 'tests/unit/mvp292-*'
      - '.github/workflows/cotironda-mvp336-correlacion-una-vez.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry-reviewed-source-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Regression Node - sin inferir unidades ni pedir confirmaciones
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp291-automatic-correlation.test.mjs \
            tests/unit/mvp292-archive-auto-recovery.test.mjs \
            tests/unit/mvp292-auto-text-correlation.test.mjs
          node scripts/piloto/mvp336-retry-source-builder.mjs --assert-local
          node scripts/piloto/mvp336-whapi-overlay-candidate.mjs
      - name: PostgreSQL17 - validaciones privadas, fuente inmutable y ROLLBACK
        run: |
          set -euo pipefail
          node scripts/piloto/mvp336-retry-source-builder.mjs --sql > supabase/tests/ci/.mvp336.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp336.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp336.sql
  edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Deno - importaciones del worker y webhook
        run: |
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-auto-recovery/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/supplier-auto-correlation-mvp336.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/supplier-auto-recovery-worker-mvp292.ts
# No secretos, OpenAI, Whapi, producción, preview ni despliegues reales.

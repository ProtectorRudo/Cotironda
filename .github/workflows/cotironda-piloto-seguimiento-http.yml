name: Cotironda PILOTO - HTTP real de seguimiento
on:
  pull_request:
    branches: [feat/mvp130-pdf-tables-source-proof]
    paths:
      - 'scripts/piloto/seguimiento-http-smoke.mjs'
      - '.github/workflows/cotironda-piloto-seguimiento-http.yml'
      - 'piloto/seguimiento-web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguimiento-publico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: HTTP de Vercel y Supabase sin credenciales privadas
        run: node scripts/piloto/seguimiento-http-smoke.mjs

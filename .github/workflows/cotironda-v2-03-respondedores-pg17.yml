name: Cotironda V2-03 - catalogo de respondedores seguro
on:
  pull_request:
    paths:
      - 'supabase/piloto/v2_03_catalogo_respondedores_privado.sql'
      - 'supabase/piloto/v2_03b_fuente_original_auditoria_privada.sql'
      - 'supabase/piloto/v2_04b_analisis_original_idempotente_privado.sql'
      - 'supabase/piloto/v2_07_buyer_auth_bootstrap_check_private.sql'
      - 'supabase/tests/fixtures/v2-07-buyer-auth-checks.sql'
      - 'src/server/v2-07-primer-comprador-auth.ts'
      - 'tests/unit/v2-07-primer-comprador-auth.test.mjs'
      - 'src/server/v2-16-primer-sms-cotironda.ts'
      - 'tests/unit/v2-16-primer-sms-cotironda.test.mjs'
      - 'apps/portal/scripts/v2-buyer-bootstrap.mjs'
      - 'supabase/tests/fixtures/v2-04b-analysis-checks.sql'
      - 'supabase/tests/ci/v2-03-respondedores-pg17.sql'
      - 'src/server/v2-03-catalogo-respondedores.ts'
      - 'src/server/v2-03-respuestas-http.ts'
      - 'apps/portal/lib/piloto-v2-respondedores-http.ts'
      - 'apps/portal/app/api/piloto/v2/rondas/**'
      - 'apps/portal/app/piloto/v2/rondas/**'
      - 'tests/unit/v2-03-respondedores-seguros.test.mjs'
      - 'tests/unit/v2-03b-descarga-original-segura.test.mjs'
      - 'tests/unit/v2-04b-analisis-persistencia.test.mjs'
      - 'src/server/v2-04b-analisis-automatica-http.ts'
      - 'src/server/v2-04b-texto-original-verificado.ts'
      - 'src/server/v2-03-catalogo-respondedores.ts'
      - 'apps/portal/lib/piloto-v2-analisis-http.ts'
      - 'src/server/v2-03b-descarga-originales.ts'
      - 'docs/V2-03B-DESCARGA-AUDITADA-20261112.md'
      - 'apps/portal/lib/piloto-v2-descarga-http.ts'
      - 'apps/portal/lib/piloto-v2-nombre-descarga.ts'
      - 'tests/unit/v2-09-extension-original.test.mjs'
      - 'apps/portal/lib/piloto-v2-actualizacion-respuestas.ts'
      - 'tests/unit/v2-11-respuestas-automaticas.test.mjs'
      - 'apps/portal/lib/piloto-v2-reintento-analisis.ts'
      - 'tests/unit/v2-12-reintento-analisis.test.mjs'
      - 'tests/unit/v2-13-aviso-adjunto-original.test.mjs'
      - 'src/server/v2-14-texto-whatsapp-cifrado.ts'
      - 'tests/unit/v2-14-texto-whatsapp-original.test.mjs'
      - 'src/server/v2-15-texto-edge-client.ts'
      - 'supabase/functions/cotironda-piloto-v2-text-reader/**'
      - 'supabase/config.toml'
      - 'tests/unit/v2-15-texto-edge-seguro.test.mjs'
      - 'supabase/piloto/mvp238_aviso_proveedor_adjunto_una_ronda.sql'
      - 'apps/portal/app/api/piloto/v2/rondas/**'
      - '.github/workflows/cotironda-v2-03-respondedores-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-v2-responders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: cotironda_ci
    steps:
      - name: Checkout sin secretos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Casos de estado, identidad y filtraciones V2
        run: node --experimental-strip-types --test tests/unit/v2-03-respondedores-seguros.test.mjs
      - name: V2-03b descarga byte a byte y auditoria
        run: node --experimental-strip-types --test tests/unit/v2-03b-descarga-original-segura.test.mjs
      - name: Extensiones reales de Excel Word PDF y tipos antiguos
        run: node --experimental-strip-types --test tests/unit/v2-09-extension-original.test.mjs
      - name: Actualizacion automática V2 sin mostrar invitados ni duplicar llamadas
        run: node --experimental-strip-types --test tests/unit/v2-11-respuestas-automaticas.test.mjs
      - name: Reintentos de analisis V2 acotados a 3 y separados 6 minutos
        run: node --experimental-strip-types --test tests/unit/v2-12-reintento-analisis.test.mjs
      - name: Aviso previo del proveedor seguido de PDF Excel acreditados V2
        run: node --experimental-strip-types --test tests/unit/v2-13-aviso-adjunto-original.test.mjs
      - name: Texto WhatsApp cifrado V2, descargas, guías y ACL
        run: node --experimental-strip-types --test tests/unit/v2-14-texto-whatsapp-original.test.mjs
      - name: V2-15 texto Edge sin AES en Vercel, JWT y permisos dobles
        run: node --experimental-strip-types --test tests/unit/v2-15-texto-edge-seguro.test.mjs
      - name: Analisis automatico, SHA, revocacion y proyeccion privada
        run: node --experimental-strip-types --test tests/unit/v2-04b-analisis-persistencia.test.mjs
      - name: Primer comprador Auth dry-run/OTP y bloqueo sin Publicalo
        run: node --experimental-strip-types --test tests/unit/v2-07-primer-comprador-auth.test.mjs
      - name: Primer SMS sin abrir signup público ni confirmar el teléfono antes de OTP
        run: node --experimental-strip-types --test tests/unit/v2-16-primer-sms-cotironda.test.mjs
      - name: PG17 aislamiento, autorizacion prospectiva y rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/v2-03-respondedores-pg17.sql
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.cotironda_piloto_v2_responders_private(uuid,uuid,uuid)') IS NULL" | grep -Fx 't'

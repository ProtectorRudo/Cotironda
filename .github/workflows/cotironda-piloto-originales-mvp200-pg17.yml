name: Cotironda PILOTO — originales v9 PG17 aislado

on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp178_original_share_consent_private.sql'
      - 'supabase/piloto/mvp191_buyer_verified_phone_identity_prospect_only.sql'
      - 'supabase/piloto/mvp192_private_originals_catalog_and_context.sql'
      - 'supabase/piloto/mvp201_original_download_audit_private.sql'
      - 'supabase/piloto/mvp208_originals_preinstall_readonly.sql'
      - 'supabase/piloto/mvp208_originals_postinstall_readonly.sql'
      - 'supabase/tests/ci/mvp200-originals-v9-pg17-rollback.sql'
      - '.github/workflows/cotironda-piloto-originales-mvp200-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  originals-v9-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compilar originales y probar todas las fuentes/consentimientos contra PostgreSQL17 aislado
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp200-originals-v9-pg17-rollback.sql > /dev/null

name: Sincronizar migración SQL inicial (Supabase dev)
on:
  push:
    branches: [fix/01-portal-auth-guardrails]
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.repository == 'ProtectorRudo/Cotironda'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Crear migración con CLI fijado
        id: gen
        run: |
          set -euo pipefail
          target="supabase/migrations/20261029105736_initial_identity_catalog.sql"
          if [[ -f "$target" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new initial_identity_catalog
          generated="$(find supabase/migrations -maxdepth 1 -name '*_initial_identity_catalog.sql' ! -name '20261029105736_initial_identity_catalog.sql' | sort | tail -n1)"
          test -n "$generated"
          mv "$generated" "$target"
          cp supabase/schema.sql "$target"
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Guardar versión exacta aplicada en Supabase dev
        if: steps.gen.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/cotironda-migration.json',JSON.stringify({message:'docs(db): versionar migracion aplicada en cotironda-dev',content:fs.readFileSync('supabase/migrations/20261029105736_initial_identity_catalog.sql').toString('base64'),branch:process.env.BRANCH}))"
          gh api --method PUT "repos/$REPO/contents/supabase/migrations/20261029105736_initial_identity_catalog.sql" --input /tmp/cotironda-migration.json > /dev/null
          rm -f /tmp/cotironda-migration.json

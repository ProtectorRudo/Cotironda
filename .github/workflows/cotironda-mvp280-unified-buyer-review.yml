name: Cotironda IA Central - aprobacion universal texto TXT CSV PDF Office MVP280
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp280_confirmacion_unificada_comprador.sql'
      - 'supabase/tests/ci/mvp280-all-buyer-sources-pg17.sql'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'tests/unit/mvp280-all-buyer-review-flows.test.mjs'
      - 'tests/unit/mvp276-buyer-media-central-broker.test.mjs'
      - 'tests/unit/mvp279-buyer-whatsapp-review.test.mjs'
      - '.github/workflows/cotironda-mvp280-unified-buyer-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-buyer-review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: All buyer reviews require a verified source, no surprise sends
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp280-all-buyer-review-flows.test.mjs \
            tests/unit/mvp279-buyer-whatsapp-review.test.mjs \
            tests/unit/mvp276-buyer-media-central-broker.test.mjs
      - name: PostgreSQL17 text, TXT, CSV, PDF, post-review tampering and rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp280-all-buyer-sources-pg17.sql >/dev/null
# Synthetic only: no Supabase PILOTO keys, real WhatsApps or OpenAI calls.

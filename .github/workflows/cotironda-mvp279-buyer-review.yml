name: Cotironda PILOTO - confirmacion explicita comprador WhatsApp MVP279
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp279_revision_confirmacion_whatsapp_binarios.sql'
      - 'supabase/tests/ci/mvp279-buyer-review-pg17.sql'
      - 'supabase/functions/cotironda-piloto-whapi/ai-central-buyer-review-mvp279.ts'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'tests/unit/mvp279-buyer-whatsapp-review.test.mjs'
      - '.github/workflows/cotironda-mvp279-buyer-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-confirmation-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Tests signed buyer review and Whapi duplicate prevention
        run: node --experimental-strip-types --test tests/unit/mvp279-buyer-whatsapp-review.test.mjs
      - name: Postgres 17 synthetic review and dispatch-gates with full rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp279-buyer-review-pg17.sql >/dev/null
# No real Supabase or Whapi credentials and no network messages.

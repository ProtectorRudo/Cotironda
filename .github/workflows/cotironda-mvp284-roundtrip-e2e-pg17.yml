name: Cotironda MVP284 - ronda completa SQL sin WhatsApp
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'scripts/piloto/mvp284-*'
      - 'tests/unit/mvp284-*'
      - 'supabase/tests/ci/mvp284-*'
      - '.github/workflows/cotironda-mvp284-roundtrip-e2e-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip-sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contrato exacto de flujo y seguridad
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp284-e2e-contract.test.mjs \
            tests/unit/mvp284-edge-roundtrip.test.mjs \
            tests/unit/mvp223-whapi-ia-central-despacho.test.mjs
          node scripts/piloto/mvp284-e2e-builder.mjs --check
      - name: PostgreSQL17 - misma transacción y rollback completo
        run: |
          set -euo pipefail
          node scripts/piloto/mvp284-e2e-builder.mjs --assert-local
          node scripts/piloto/mvp284-e2e-builder.mjs --sql > supabase/tests/ci/.mvp284-roundtrip.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp284-roundtrip.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT (to_regnamespace('cotironda_piloto_privado') IS NULL AND to_regnamespace('auth') IS NULL AND to_regnamespace('storage') IS NULL)" | grep -Fx 't'
          rm supabase/tests/ci/.mvp284-roundtrip.sql
      - name: Cierre y plan de finalistas en entorno aislado sin notificar
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp196-finalists-source-off.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp209-finalists-plan-only-cron-pg17.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp211-capacity-12x30-pg17.sql >/dev/null
# No Supabase remoto/Whapi/OpenAI. E2E REAL sigue sin certificarse.

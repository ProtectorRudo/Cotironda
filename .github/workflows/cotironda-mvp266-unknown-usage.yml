name: Cotironda IA Central etapa 7 - retencion de consumo incierto MVP266
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp266_openai_unknown_persistent_review.sql'
      - 'supabase/piloto/mvp264_openai_usage_meters.sql'
      - 'supabase/tests/ci/mvp266-ai-usage-persistent-review-pg17.sql'
      - 'tests/unit/mvp266-ai-usage-persistent-review.test.mjs'
      - '.github/workflows/cotironda-mvp266-unknown-usage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-no-expirar-desconocidos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'PG17: retencion >24h, operador, cuota, idempotencia y RLS'
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/ci/mvp266-ai-usage-persistent-review-pg17.sql
  node-contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'Contrato de seguridad contable'
        run: >-
          node --test tests/unit/mvp266-ai-usage-persistent-review.test.mjs
# No OpenAI calls, Whapi, cron, Supabase live or deployment.

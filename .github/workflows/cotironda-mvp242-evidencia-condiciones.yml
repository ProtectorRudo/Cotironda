name: Cotironda — evidencia IVA flete pago MVP242
on:
  pull_request:
    paths:
      - 'src/domain/ia-central/evidencia-condiciones-mvp242.ts'
      - 'src/domain/ia-central/lector-presupuesto-proveedor-mvp225.ts'
      - 'src/domain/ia-central/calificador-cotizaciones-mvp225.ts'
      - 'tests/unit/mvp242-condiciones-iva-flete-pago.test.mjs'
      - '.github/workflows/cotironda-mvp242-evidencia-condiciones.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 'MVP242: IVA, flete, pago, citas y lectura original'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp242-condiciones-iva-flete-pago.test.mjs
          tests/unit/mvp241-evidencia-monetaria-cantidades.test.mjs
          tests/unit/mvp225-lector-ia-presupuestos.test.mjs
          tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs
          tests/unit/mvp227-recepcion-presupuesto-evaluado.test.mjs

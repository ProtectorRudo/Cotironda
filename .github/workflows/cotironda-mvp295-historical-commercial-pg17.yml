name: Cotironda MVP295 - quoted text commercial backfill PG17
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp295_*'
      - 'supabase/tests/ci/mvp295-*'
      - 'scripts/piloto/mvp295-*'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-linked-text-replay-mvp295.ts'
      - 'supabase/functions/cotironda-piloto-auto-recovery/index.ts'
      - 'supabase/functions/cotironda-piloto-seguimiento/index.ts'
      - 'tests/unit/mvp295-*'
      - '.github/workflows/cotironda-mvp295-historical-commercial-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-source-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Offline unit tests - linked quote source and first buyer offer
        run: |
          node --experimental-strip-types --test tests/unit/mvp295-linked-commercial-recovery.test.mjs
          node --experimental-strip-types --test tests/unit/mvp292-archive-auto-recovery.test.mjs
          node scripts/piloto/mvp295-linked-commercial-builder.mjs --assert-local
      - name: PostgreSQL 17 - cumulative source-bound one-shot and rollback
        run: |
          set -euo pipefail
          node scripts/piloto/mvp295-linked-commercial-builder.mjs --sql > supabase/tests/ci/.mvp295.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp295.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp295.sql
  edge-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Typecheck private worker, buyer tracking and original Whapi
        run: |
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-auto-recovery/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-seguimiento/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.ts
# Synthetic only. No real project, billable calls, WhatsApp, cron or deployments.

name: Cotironda MVP292 - texto y originales automaticos PG17
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'supabase/functions/cotironda-piloto-whapi/supplier-*mvp29*.ts'
      - 'supabase/functions/cotironda-piloto-auto-recovery/**'
      - 'supabase/piloto/mvp292_*'
      - 'supabase/tests/ci/mvp292-*'
      - 'scripts/piloto/mvp292-*'
      - 'tests/unit/mvp292-*'
      - '.github/workflows/cotironda-mvp292-autorecovery-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autonomous-recovery-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Node - free chat, replay idempotence and no user action
        run: |
          node --experimental-strip-types --test \
            tests/unit/mvp291-automatic-correlation.test.mjs \
            tests/unit/mvp292-auto-text-correlation.test.mjs \
            tests/unit/mvp292-archive-auto-recovery.test.mjs \
            tests/unit/mvp289-buyer-tracking-confirmation.test.mjs
          node scripts/piloto/mvp292-supplier-autorecovery-builder.mjs --assert-local
      - name: PG17 - only private source reconciliation, synthetic rollback
        run: |
          set -euo pipefail
          node scripts/piloto/mvp292-supplier-autorecovery-builder.mjs --sql > supabase/tests/ci/.mvp292.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp292.sql >/dev/null
          psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('cotironda_piloto_privado') IS NULL" | grep -Fx 't'
          rm supabase/tests/ci/.mvp292.sql
  edge-worker-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - name: Check inactive private scheduled worker and original Whapi
        run: |
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-auto-recovery/index.ts
          deno check --node-modules-dir=auto supabase/functions/cotironda-piloto-whapi/index.ts
# no cloud keys, no real WhatsApp/cron, no Supabase real, no deploy.

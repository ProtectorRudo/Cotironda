name: Portal Next.js - Build seguro
on:
  pull_request:
  push:
    branches: [feat/01-portal-registro]
permissions:
  contents: read
jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Instalar versiones exactas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxis del E2E sin red ni credenciales
        run: node --check scripts/auth-real-smoke.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Compilar con registro deshabilitado
        env:
          COTIRONDA_REGISTRATION_ENABLED: 'false'
        run: npm run build
      - name: Smoke HTTP con autenticación desactivada
        env:
          COTIRONDA_REGISTRATION_ENABLED: 'false'
        run: node scripts/smoke-disabled.mjs

name: MVP311 - identidad real en 14 RPC activas sin exponer finalistas
on:
  pull_request:
    branches: [feat/mvp174-supplier-packaging-equivalence]
    paths:
      - 'supabase/piloto/mvp311_multiidentidad_rutas_activas.sql'
      - 'supabase/tests/ci/mvp311-legacy-rpc-baseline-pg17.sql'
      - 'supabase/tests/ci/mvp311-multiidentity-tests-pg17.sql'
      - 'scripts/piloto/mvp311-generar-fixture-pg17.mjs'
      - 'tests/unit/mvp311-*'
      - '.github/workflows/cotironda-mvp311-rpc-identidad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contratos de las 14 RPC y privacidad del arquitecto
        run: |
          node --test tests/unit/mvp311-multiidentity-rpc.test.mjs tests/unit/mvp310-multi-admin-enrollment.test.mjs
      - name: PostgreSQL17 - congelar baseline, migrar y comprobar roles y cruces
        run: |
          set -euo pipefail
          node scripts/piloto/mvp311-generar-fixture-pg17.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/.mvp311-generated-pg17.sql >/dev/null
# No hay conexiones con Supabase real ni Whapi. Rollback completo.

name: Cotironda IA Central etapa 5 - comprobantes Whapi inciertos MVP257
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'supabase/piloto/mvp257_whapi_uncertain_evidence.sql'
      - 'supabase/tests/ci/mvp257-whapi-uncertain-pg17.sql'
      - 'supabase/functions/cotironda-piloto-whapi/index.ts'
      - 'tests/unit/mvp257-whapi-uncertain-evidence.test.mjs'
      - '.github/workflows/cotironda-mvp257-whapi-uncertain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-uncertain-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 'MVP257: comprobar eventos, suplantación, repeticiones, ranking y rollback'
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/ci/mvp257-whapi-uncertain-pg17.sql
  whapi-status-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 'MVP257: webhook Whapi auténtico, privacidad y reintentos seguros'
        run: >-
          node --experimental-strip-types --test
          tests/unit/mvp257-whapi-uncertain-evidence.test.mjs
          tests/unit/mvp119-whapi-status-delivery.test.mjs
          tests/unit/mvp073-whapi-edge.test.mjs
          tests/unit/mvp256-safe-document-retry.test.mjs
# Sin WhatsApp real, secretos ni despliegues.

name: Cotironda IA Central - gate integrado etapas 1, 2 y 3
on:
  pull_request:
    branches:
      - feat/mvp174-supplier-packaging-equivalence
    paths:
      - 'src/domain/ia-central/**'
      - 'supabase/functions/cotironda-piloto-whapi/**'
      - 'supabase/piloto/mvp2**'
      - 'supabase/tests/ci/mvp2**'
      - 'tests/unit/ia-central-etapas-123-integradas.test.mjs'
      - 'tests/unit/mvp2**'
      - '.github/workflows/cotironda-ia-central-etapas-123-integracion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato-integrado:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: 'Etapas 1-3: semántica, ruteo, asociación y cotización verificable'
        run: |
          node --experimental-strip-types --test \
            tests/unit/ia-central-etapas-123-integradas.test.mjs \
            tests/unit/mvp216-ia-central-rubros.test.mjs \
            tests/unit/mvp219-ruteo-catalogo-semantico.test.mjs \
            tests/unit/mvp225-asociacion-calificacion-rubros.test.mjs \
            tests/unit/mvp225-lector-ia-presupuestos.test.mjs \
            tests/unit/mvp238-aviso-adjunto-proveedor.test.mjs \
            tests/unit/mvp239-aclaracion-ronda.test.mjs \
            tests/unit/mvp241-evidencia-monetaria-cantidades.test.mjs \
            tests/unit/mvp242-condiciones-iva-flete-pago.test.mjs \
            tests/unit/mvp244-presupuestos-sin-omision-de-cargos.test.mjs \
            tests/unit/mvp245-documentos-comerciales-ia-central.test.mjs \
            tests/unit/mvp249-flete-pdf-independiente.test.mjs

  postgres-17-sin-envios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 'Etapas 1-3: contratos SQL reales con datos sintéticos y ROLLBACK'
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            mvp220-ia-catalogo-pg17-rollback.sql \
            mvp221-ia-rondas-sombra-pg17.sql \
            mvp222-ia-despacho-pg17-rollback.sql \
            mvp223-ia-webhook-despacho-pg17.sql \
            mvp225-proveedor-ronda-identidad-pg17.sql \
            mvp226-ia-central-inbound-pg17.sql \
            mvp227-cotizaciones-por-rubro-pg17.sql \
            mvp236_asociacion_respuestas_pg17.sql \
            mvp238_aviso_adjunto_pg17.sql \
            mvp239_aclaracion_ronda_pg17.sql \
            mvp248-publicador-multirubro-sin-pii.sql \
            mvp250-marcas-materiales-sin-pii.sql
          do
            echo "Verificando $suite"
            psql -X -v ON_ERROR_STOP=1 -f "supabase/tests/ci/$suite" > /dev/null
          done
          echo "PASS: 12 suites PostgreSQL 17, sin efectos persistentes."

# Este gate NO invoca modelos reales, Whapi ni Supabase PILOTO.
# No habilita el envío, el ranking, la publicación o la revelación de contactos.

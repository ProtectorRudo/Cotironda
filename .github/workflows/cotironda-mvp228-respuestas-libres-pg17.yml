name: Cotironda IA Central — respuestas libres sin perder cliente PG17
on:
  pull_request:
    paths:
      - 'supabase/piloto/mvp228_proteger_respuestas_libres_ia_central.sql'
      - 'supabase/tests/ci/mvp228_respuestas_libres_y_guard_pg17.sql'
      - '.github/workflows/cotironda-mvp228-respuestas-libres-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cotironda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cotironda_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: cotironda_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: "Fuente de presupuesto libre, asociación segura, guard independiente y ROLLBACK"
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci/mvp228_respuestas_libres_y_guard_pg17.sql > /dev/null
